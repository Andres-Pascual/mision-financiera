<style>
/* Layout: consola de mando — barra HUD superior fija, panel central de misión, rail lateral de telemetría (ranking) que se apila en móvil. Diseño oscuro deliberado (una sola apariencia). */
:root{
  --noche:#0A0F24; --panel:#111938; --panel2:#18224A; --linea:#2A3570;
  --morado:#7C4DFF; --morado2:#B39DFF; --oro:#F2B705; --oro2:#FFE08A;
  --texto:#E9ECFF; --tenue:#98A2CC; --ok:#2BD47D; --mal:#FF5470;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --cuerpo:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--noche);color:var(--texto);font-family:var(--cuerpo);font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 80% -10%,rgba(124,77,255,.22),transparent 45%),
  linear-gradient(rgba(42,53,112,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(42,53,112,.18) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--noche)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,15,36,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--linea)}
.hud-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.marca b{color:var(--oro)}
.radar{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--morado2);position:relative;overflow:hidden;flex:none}
.radar::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(242,183,5,.7),transparent 25%);animation:giro 3s linear infinite}
@keyframes giro{to{transform:rotate(1turn)}}
.ticker{flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--tenue)}
.ticker span{display:inline-block;animation:tick 40s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
.ticker em{color:var(--oro2);font-style:normal}
.piloto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tenue)}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#0A0F24;flex:none}
main{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(30px,5.4vw,56px);letter-spacing:.01em}
h2{font-size:24px}
h3{font-size:17px}
.eti{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--morado2)}
.tenue{color:var(--tenue)}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--linea);border-radius:14px;padding:20px;position:relative}
.panel.marco::before,.panel.marco::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--oro)}
.panel.marco::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.panel.marco::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.btn{border:1px solid var(--linea);background:var(--panel2);border-radius:10px;padding:11px 18px;font-family:var(--display);font-weight:600;letter-spacing:.04em;transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--morado2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--morado);border-color:var(--morado);color:#fff}
.btn.pri:hover{background:#8E63FF}
.btn.oro{background:var(--oro);border-color:var(--oro);color:#151000}
.btn.chico{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
input[type=text],input[type=number],select,textarea{background:var(--noche);border:1px solid var(--linea);border-radius:9px;padding:10px 12px;width:100%}
textarea{min-height:90px;font-family:var(--mono);font-size:13px}
label{display:grid;gap:6px;font-size:13px;color:var(--tenue)}
/* Inicio */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.hero p.lead{font-size:17px;color:var(--tenue);max-width:58ch;margin:14px 0 22px}
.hero h1 .oro{color:var(--oro)}
.consola{font-family:var(--mono);font-size:13px;display:grid;gap:8px}
.consola .l{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--linea);padding-bottom:6px}
.consola .l b{color:var(--oro2);font-weight:600}
.mapa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
.nodo{text-align:left;background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:14px;display:grid;gap:6px;min-width:0}
.nodo .n{font-family:var(--display);font-size:26px;color:var(--morado2);line-height:1}
.nodo.bloq{opacity:.45}
.nodo .med{font-family:var(--mono);font-size:11px;color:var(--oro)}
.modos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.modo{text-align:left;display:grid;gap:8px;align-content:start;min-width:0}
.modo .dur{font-family:var(--mono);color:var(--oro2);font-size:12px}
/* Juego */
.juego{display:grid;grid-template-columns:1fr 290px;gap:20px;align-items:start}
.barra{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.vidas{display:flex;gap:4px}
.vida{width:20px;height:18px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--linea);border-radius:99px;padding:3px 10px;color:var(--tenue);white-space:nowrap}
.chip.oro{color:var(--oro2);border-color:rgba(242,183,5,.5)}
.chip.mor{color:var(--morado2);border-color:rgba(179,157,255,.5)}
.reloj{width:74px;height:74px;flex:none;position:relative}
.reloj svg{transform:rotate(-90deg)}
.reloj .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700}
.reloj.critico .t{color:var(--mal)}
.pregunta{font-size:clamp(17px,2.2vw,21px);font-weight:500;margin:10px 0 18px;max-width:70ch}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.op{text-align:left;background:var(--noche);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.op:hover:not([disabled]){border-color:var(--morado2);background:#0E1430}
.op .k{font-family:var(--display);font-weight:700;color:var(--oro);flex:none;width:20px}
.op .tx{min-width:0;overflow-wrap:anywhere}
.op.bien{border-color:var(--ok);background:rgba(43,212,125,.12)}
.op.malo{border-color:var(--mal);background:rgba(255,84,112,.12)}
.op.fuera{opacity:.25}
.op[disabled]{cursor:default}
.poderes{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.poder{display:flex;align-items:center;gap:6px;border:1px solid rgba(179,157,255,.45);background:rgba(124,77,255,.12);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600}
.poder.activo{border-color:var(--oro);background:rgba(242,183,5,.16);color:var(--oro2)}
.poder[disabled]{opacity:.35;cursor:not-allowed}
.feedback{margin-top:18px;border-radius:12px;padding:16px;border:1px solid;display:grid;gap:8px}
.feedback.ok{border-color:var(--ok);background:rgba(43,212,125,.08)}
.feedback.no{border-color:var(--mal);background:rgba(255,84,112,.08)}
.feedback h3{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pasos{font-family:var(--mono);font-size:13px;margin:0;padding-left:20px;display:grid;gap:3px;overflow-wrap:anywhere}
.pista{margin-top:12px;font-family:var(--mono);font-size:13px;border-left:3px solid var(--oro);padding:8px 12px;background:rgba(242,183,5,.07)}
.rail{display:grid;gap:16px;min-width:0}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:24px 30px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;background:var(--noche);font-size:14px;min-width:0}
.rank li.yo{outline:1px solid var(--oro)}
.rank .pos{font-family:var(--display);color:var(--tenue);text-align:center}
.rank .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .pts{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--oro2)}
.rank .sub{display:block;font-size:11px;color:var(--tenue)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--oro);color:#151000;font-family:var(--display);font-weight:700;padding:10px 18px;border-radius:12px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
/* Logros */
.insignias{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ins{display:grid;gap:6px;justify-items:start;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--linea)}
.ins.no{opacity:.4;filter:grayscale(1)}
.ins svg{width:42px;height:42px}
/* Admin */
.tabla{overflow-x:auto;border:1px solid var(--linea);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);background:var(--panel);position:sticky;top:0}
td.enun{min-width:280px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--linea);background:transparent;border-radius:99px;padding:6px 14px;font-size:13px}
.tab.on{background:var(--morado);border-color:var(--morado);color:#fff}
.resultado-num{font-family:var(--display);font-size:clamp(40px,8vw,72px);color:var(--oro);line-height:1}
.medalla{width:90px;height:90px}
.codigo{font-family:var(--display);font-size:40px;letter-spacing:.3em;color:var(--oro)}
@media (max-width:900px){
  .hero,.juego{grid-template-columns:1fr}
  .modos{grid-template-columns:1fr}
  .mapa{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .opciones{grid-template-columns:1fr}
  .ticker{display:none}
  .hud-in{justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="piloto" id="piloto"></div>

<script type="application/json" id="banco-json">{"niveles": {"1": "Fundamentos del dinero e interés", "2": "Interés simple", "3": "Interés compuesto", "4": "Conversión de tasas", "5": "Valor presente y valor futuro", "6": "Anualidades vencidas", "7": "Anualidades anticipadas", "8": "Gran reto financiero"}, "preguntas": [{"id": "Q001", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Qué establece el principio del valor del dinero en el tiempo?", "opciones": ["Un peso futuro vale más porque se recibe después.", "El dinero solo cambia de valor por la inflación.", "Un peso hoy vale lo mismo que un peso dentro de un año.", "Un peso hoy vale más que un peso en el futuro, porque puede invertirse y generar rendimientos."], "correcta": 3, "feedback": ["Es al revés: recibir el dinero más tarde implica renunciar a los rendimientos que generaría mientras tanto.", "La inflación influye, pero el principio se basa sobre todo en el costo de oportunidad y el riesgo, incluso con inflación cero.", "Esto ignora el costo de oportunidad: el peso de hoy puede invertirse y valer más mañana.", "¡Correcto! El dinero disponible hoy tiene un costo de oportunidad: puede invertirse y crecer. Por eso, para comparar sumas en fechas distintas hay que llevarlas a una misma fecha usando una tasa de interés."], "explicacion": "El dinero disponible hoy tiene un costo de oportunidad: puede invertirse y crecer. Por eso, para comparar sumas en fechas distintas hay que llevarlas a una misma fecha usando una tasa de interés.", "pasos": []}, {"id": "Q002", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Qué es el interés?", "opciones": ["El precio que se paga por usar dinero ajeno durante un tiempo.", "La variación general de precios de la economía.", "El impuesto que cobra el banco por cada transacción.", "El capital que se presta inicialmente."], "correcta": 0, "feedback": ["¡Correcto! El interés es la compensación que recibe quien presta (o el costo de quien pide prestado) por el uso del dinero durante un periodo.", "Esa es la inflación, un concepto distinto aunque relacionado.", "Un impuesto o comisión no es interés; el interés remunera el uso del dinero en el tiempo.", "Ese es el capital o principal (P); el interés es lo que se paga ADICIONAL por usarlo."], "explicacion": "El interés es la compensación que recibe quien presta (o el costo de quien pide prestado) por el uso del dinero durante un periodo.", "pasos": []}, {"id": "Q003", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "La tasa de interés se define como:", "opciones": ["La relación entre el interés generado en un periodo y el capital, expresada en porcentaje.", "El valor en pesos del interés ganado.", "El número de periodos de la operación.", "El monto final acumulado al terminar el plazo."], "correcta": 0, "feedback": ["¡Correcto! i = I / P para un periodo. Por ejemplo, si 1.000.000 genera 20.000 en un mes, la tasa es 2% mensual.", "Ese es el interés (I), un valor absoluto. La tasa es relativa: I dividido por P.", "Eso es n. La tasa expresa cuánto rinde el capital por periodo.", "Ese es el valor futuro (F), no la tasa."], "explicacion": "i = I / P para un periodo. Por ejemplo, si 1.000.000 genera 20.000 en un mes, la tasa es 2% mensual.", "pasos": []}, {"id": "Q004", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "En la notación de Ingeniería Económica, ¿qué representa la letra P?", "opciones": ["El número de periodos.", "El valor acumulado al final del plazo.", "El valor presente: una cantidad ubicada en el momento cero.", "El pago periódico de una serie uniforme."], "correcta": 2, "feedback": ["El número de periodos se denota con n.", "Ese es F, el valor futuro.", "¡Correcto! P = valor presente, F = valor futuro, A = pago periódico (anualidad), i = tasa por periodo, n = número de periodos.", "El pago periódico se denota con A."], "explicacion": "P = valor presente, F = valor futuro, A = pago periódico (anualidad), i = tasa por periodo, n = número de periodos.", "pasos": []}, {"id": "Q005", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Qué es el costo de oportunidad del dinero?", "opciones": ["El interés que cobra cualquier banco.", "Una pérdida contable registrada en el balance.", "El costo total de la inversión elegida.", "El rendimiento de la mejor alternativa a la que se renuncia al elegir una inversión."], "correcta": 3, "feedback": ["Un banco puede ser una alternativa, pero el costo de oportunidad es la MEJOR alternativa sacrificada.", "El costo de oportunidad es económico, no aparece como pérdida contable.", "Ese es el costo de la inversión, no lo que se deja de ganar en la alternativa.", "¡Correcto! Si eliges un proyecto, dejas de ganar lo que te daría la mejor alternativa disponible; esa tasa suele usarse como tasa de descuento (TIO)."], "explicacion": "Si eliges un proyecto, dejas de ganar lo que te daría la mejor alternativa disponible; esa tasa suele usarse como tasa de descuento (TIO).", "pasos": []}, {"id": "Q006", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "En un diagrama de flujo de caja, por convención:", "opciones": ["Las flechas representan la tasa de interés de cada periodo.", "Las flechas hacia arriba son egresos y hacia abajo ingresos.", "Las flechas hacia arriba son ingresos y las flechas hacia abajo son egresos.", "Solo se dibujan los ingresos, nunca los egresos."], "correcta": 2, "feedback": ["Las flechas representan flujos de dinero; la tasa se anota aparte.", "Es la convención invertida; lo usual es arriba = ingreso, abajo = egreso.", "¡Correcto! El diagrama ubica en una línea de tiempo cada flujo; arriba lo que entra y abajo lo que sale, desde el punto de vista de quien analiza.", "Se dibujan ambos para ver el panorama completo de la operación."], "explicacion": "El diagrama ubica en una línea de tiempo cada flujo; arriba lo que entra y abajo lo que sale, desde el punto de vista de quien analiza.", "pasos": []}, {"id": "Q007", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Dos cantidades ubicadas en fechas distintas son financieramente equivalentes cuando:", "opciones": ["La inflación del periodo es cero.", "Tienen exactamente el mismo valor en pesos.", "Tienen el mismo valor al llevarlas a una fecha común con una tasa dada.", "Se pagan dentro del mismo mes."], "correcta": 2, "feedback": ["Aun sin inflación existe costo de oportunidad; la clave es la tasa de interés.", "Mismo valor nominal en fechas distintas NO es equivalente, porque el dinero cambia de valor en el tiempo.", "¡Correcto! La equivalencia depende de la tasa: 1.000.000 hoy y 1.100.000 en un año son equivalentes solo si la tasa es 10% anual.", "La equivalencia no depende del mes, sino de la tasa y la fecha focal."], "explicacion": "La equivalencia depende de la tasa: 1.000.000 hoy y 1.100.000 en un año son equivalentes solo si la tasa es 10% anual.", "pasos": []}, {"id": "Q008", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Cuál de los siguientes factores NO explica el valor del dinero en el tiempo?", "opciones": ["La denominación de los billetes con que se paga.", "El riesgo de no recibir el dinero.", "La inflación.", "El costo de oportunidad."], "correcta": 0, "feedback": ["¡Correcto! El valor del dinero en el tiempo se explica por el costo de oportunidad, la inflación y el riesgo. Pagar con billetes de 50.000 o de 100.000 no cambia nada.", "El riesgo sí influye: un pago futuro es incierto y por eso vale menos hoy.", "La inflación sí reduce el poder adquisitivo del dinero futuro.", "Es el factor central: el dinero de hoy puede invertirse."], "explicacion": "El valor del dinero en el tiempo se explica por el costo de oportunidad, la inflación y el riesgo. Pagar con billetes de 50.000 o de 100.000 no cambia nada.", "pasos": []}, {"id": "Q009", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Inviertes $1.000.000 y al cabo de un año recibes $1.080.000. ¿Cuál fue la tasa de interés anual?", "opciones": ["80,00%", "8,00%", "0,80%", "108,00%"], "correcta": 1, "feedback": ["Revisa la división: 80.000/1.000.000 = 0,08, que equivale a 8%, no a 80%.", "¡Correcto! Solución: I = F − P = 1.080.000 − 1.000.000 = 80.000 → i = I / P = 80.000 / 1.000.000 = 0,08 = 8% anual", "Corriste la coma de más: 0,08 son 8%, no 0,8%.", "1,08 es el factor (1 + i); la tasa es 1,08 − 1 = 0,08."], "explicacion": "Solución: I = F − P = 1.080.000 − 1.000.000 = 80.000 → i = I / P = 80.000 / 1.000.000 = 0,08 = 8% anual", "pasos": ["I = F − P = 1.080.000 − 1.000.000 = 80.000", "i = I / P = 80.000 / 1.000.000 = 0,08 = 8% anual"]}, {"id": "Q010", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "contrarreloj", "tiempo": 20, "puntos": 150, "enunciado": "Un capital de $2.500.000 gana 2% mensual. ¿Cuánto interés genera en un mes?", "opciones": ["$5.000", "$500.000", "$50.000", "$2.550.000"], "correcta": 2, "feedback": ["El 2% en decimal es 0,02, no 0,002.", "Usaste 0,2 en lugar de 0,02: el 2% es 0,02.", "¡Correcto! Solución: I = P · i = 2.500.000 × 0,02 = 50.000", "Ese es el monto total (P + I), no solo el interés."], "explicacion": "Solución: I = P · i = 2.500.000 × 0,02 = 50.000", "pasos": ["I = P · i = 2.500.000 × 0,02 = 50.000"]}, {"id": "Q011", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "contrarreloj", "tiempo": 20, "puntos": 150, "enunciado": "¿Cómo se expresa una tasa de 1,5% en forma decimal?", "opciones": ["0,0015", "0,0150", "0,1500", "1,5000"], "correcta": 1, "feedback": ["Dividiste entre 1.000; para pasar de % a decimal se divide entre 100.", "¡Correcto! Solución: 1,5% = 1,5 / 100 = 0,015", "Eso sería 15%. Divide entre 100: 1,5/100 = 0,015.", "Ese es el número en porcentaje; en decimal se divide entre 100."], "explicacion": "Solución: 1,5% = 1,5 / 100 = 0,015", "pasos": ["1,5% = 1,5 / 100 = 0,015"]}, {"id": "Q012", "nivel": 1, "tema": "Fundamentos del dinero e interés", "tipo": "caso", "tiempo": 120, "puntos": 250, "enunciado": "Te ofrecen $1.000.000 hoy o $1.100.000 dentro de un año. Tu tasa de oportunidad es 12% anual. ¿Qué te conviene?", "opciones": ["Recibir $1.100.000, porque su VP es $1.232.000", "Recibir $1.100.000 en un año, porque es más dinero", "Recibir $1.000.000 hoy, porque el VP de $1.100.000 es $982.142,86", "Es indiferente, ambas valen lo mismo"], "correcta": 2, "feedback": ["Multiplicaste por 1,12 (llevaste al futuro); para el VP se divide.", "Comparar valores nominales de fechas distintas ignora el valor del dinero en el tiempo; a 12% su VP es solo $982.142,86.", "¡Correcto! Solución: Llevar el pago futuro a hoy: P = 1.100.000 / (1,12)^1 = 982.142,86 → Comparar en la misma fecha: 1.000.000 > 982.142,86 → Conviene recibir el dinero hoy", "Serían equivalentes solo con una tasa del 10%; con 12% el pago futuro vale menos hoy."], "explicacion": "Solución: Llevar el pago futuro a hoy: P = 1.100.000 / (1,12)^1 = 982.142,86 → Comparar en la misma fecha: 1.000.000 > 982.142,86 → Conviene recibir el dinero hoy", "pasos": ["Llevar el pago futuro a hoy: P = 1.100.000 / (1,12)^1 = 982.142,86", "Comparar en la misma fecha: 1.000.000 > 982.142,86", "Conviene recibir el dinero hoy"]}, {"id": "Q013", "nivel": 2, "tema": "Interés simple", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "En el interés simple, el interés de cada periodo se calcula sobre:", "opciones": ["El capital inicial, siempre el mismo en todos los periodos.", "Un capital que crece con la inflación.", "El saldo acumulado (capital más intereses anteriores).", "El valor futuro de la operación."], "correcta": 0, "feedback": ["¡Correcto! En interés simple los intereses NO se capitalizan: I = P·i·n y el interés de cada periodo es constante.", "El interés simple no ajusta el capital por inflación.", "Eso describe el interés compuesto.", "El interés se calcula sobre P, no sobre F."], "explicacion": "En interés simple los intereses NO se capitalizan: I = P·i·n y el interés de cada periodo es constante.", "pasos": []}, {"id": "Q014", "nivel": 2, "tema": "Interés simple", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Cuál es la fórmula del valor futuro con interés simple?", "opciones": ["F = P / (1 + i·n)", "F = P · i · n", "F = P (1 + i)^n", "F = P (1 + i·n)"], "correcta": 3, "feedback": ["Esa expresión despeja P a partir de F, no calcula F.", "Eso es solo el interés (I), le falta sumar el capital.", "Esa es la fórmula del interés compuesto.", "¡Correcto! El monto es el capital más el interés: F = P + P·i·n = P(1 + i·n)."], "explicacion": "El monto es el capital más el interés: F = P + P·i·n = P(1 + i·n).", "pasos": []}, {"id": "Q015", "nivel": 2, "tema": "Interés simple", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Al graficar el monto acumulado con interés simple en el tiempo se obtiene:", "opciones": ["Una curva decreciente.", "Una línea horizontal.", "Una curva exponencial.", "Una línea recta (crecimiento lineal)."], "correcta": 3, "feedback": ["El monto con interés positivo nunca disminuye.", "Eso implicaría que no se generan intereses.", "Esa forma corresponde al interés compuesto.", "¡Correcto! Como el interés por periodo es constante, F = P + P·i·n crece en forma lineal con n."], "explicacion": "Como el interés por periodo es constante, F = P + P·i·n crece en forma lineal con n.", "pasos": []}, {"id": "Q016", "nivel": 2, "tema": "Interés simple", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "El interés simple 'comercial' u 'ordinario' utiliza un año de:", "opciones": ["360 días.", "365 días.", "366 días siempre.", "12 días."], "correcta": 0, "feedback": ["¡Correcto! El interés comercial usa 360 días (12 meses de 30). El interés exacto o real usa 365 (o 366) días.", "Ese es el interés exacto o real.", "Solo los años bisiestos tienen 366 días, y aplica al interés exacto.", "El año tiene 12 meses, no 12 días."], "explicacion": "El interés comercial usa 360 días (12 meses de 30). El interés exacto o real usa 365 (o 366) días.", "pasos": []}, {"id": "Q017", "nivel": 2, "tema": "Interés simple", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Con interés simple, si se duplica el tiempo de la inversión, el interés ganado:", "opciones": ["Se duplica.", "Se cuadruplica.", "Permanece igual.", "Aumenta más del doble."], "correcta": 0, "feedback": ["¡Correcto! I = P·i·n es proporcional a n: si n se duplica, I se duplica.", "Eso no ocurre ni con interés simple ni compuesto en plazos usuales.", "El interés sí depende del tiempo.", "Eso pasa con el interés compuesto, no con el simple."], "explicacion": "I = P·i·n es proporcional a n: si n se duplica, I se duplica.", "pasos": []}, {"id": "Q018", "nivel": 2, "tema": "Interés simple", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Se prestan $5.000.000 al 1,5% mensual simple durante 8 meses. ¿Cuánto interés se genera?", "opciones": ["$632.462,93", "$5.600.000,00", "$60.000,00", "$600.000,00"], "correcta": 3, "feedback": ["Ese resultado usa interés compuesto; el enunciado indica interés simple.", "Ese es el monto F; el interés es solo F − P.", "Revisa la multiplicación: 5.000.000 × 0,015 = 75.000; × 8 = 600.000.", "¡Correcto! Solución: I = P · i · n → I = 5.000.000 × 0,015 × 8 = 600.000"], "explicacion": "Solución: I = P · i · n → I = 5.000.000 × 0,015 × 8 = 600.000", "pasos": ["I = P · i · n", "I = 5.000.000 × 0,015 × 8 = 600.000"]}, {"id": "Q019", "nivel": 2, "tema": "Interés simple", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuál es el valor futuro de $3.200.000 invertidos al 18% anual simple durante 9 meses?", "opciones": ["$432.000,00", "$3.622.942,85", "$3.632.000,00", "$8.384.000,00"], "correcta": 2, "feedback": ["Ese es solo el interés; falta sumar el capital.", "Usaste interés compuesto; el enunciado indica interés simple.", "¡Correcto! Solución: n = 9/12 = 0,75 años → F = P(1 + i·n) = 3.200.000 × (1 + 0,18 × 0,75) → F = 3.200.000 × 1,135 = 3.632.000", "Tomaste n = 9 años; el plazo es 9 meses = 0,75 años."], "explicacion": "Solución: n = 9/12 = 0,75 años → F = P(1 + i·n) = 3.200.000 × (1 + 0,18 × 0,75) → F = 3.200.000 × 1,135 = 3.632.000", "pasos": ["n = 9/12 = 0,75 años", "F = P(1 + i·n) = 3.200.000 × (1 + 0,18 × 0,75)", "F = 3.200.000 × 1,135 = 3.632.000"]}, {"id": "Q020", "nivel": 2, "tema": "Interés simple", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuánto debe invertirse hoy al 2% mensual simple para tener $7.540.000 en 10 meses?", "opciones": ["$6.185.426,18", "$6.283.333,33", "$6.032.000,00", "$1.508.000,00"], "correcta": 1, "feedback": ["Ese cálculo es con interés compuesto.", "¡Correcto! Solución: P = F / (1 + i·n) → P = 7.540.000 / (1 + 0,02 × 10) = 7.540.000 / 1,2 → P = 6.283.333,33", "Aplicaste descuento comercial (F·(1 − i·n)); el VP con interés simple se obtiene dividiendo.", "Eso es el interés sobre F, no el valor presente."], "explicacion": "Solución: P = F / (1 + i·n) → P = 7.540.000 / (1 + 0,02 × 10) = 7.540.000 / 1,2 → P = 6.283.333,33", "pasos": ["P = F / (1 + i·n)", "P = 7.540.000 / (1 + 0,02 × 10) = 7.540.000 / 1,2", "P = 6.283.333,33"]}, {"id": "Q021", "nivel": 2, "tema": "Interés simple", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Un capital de $4.000.000 se convierte en $4.720.000 en 12 meses con interés simple. ¿Cuál es la tasa mensual?", "opciones": ["18,0000%", "0,1500%", "1,5000%", "1,3888%"], "correcta": 2, "feedback": ["18% es la tasa de todo el año; debes dividir entre los 12 meses.", "Revisa los decimales: 0,015 es 1,5%.", "¡Correcto! Solución: I = 4.720.000 − 4.000.000 = 720.000 → i = I / (P·n) = 720.000 / (4.000.000 × 12) → i = 0,015 = 1,5% mensual", "Ese cálculo es de interés compuesto."], "explicacion": "Solución: I = 4.720.000 − 4.000.000 = 720.000 → i = I / (P·n) = 720.000 / (4.000.000 × 12) → i = 0,015 = 1,5% mensual", "pasos": ["I = 4.720.000 − 4.000.000 = 720.000", "i = I / (P·n) = 720.000 / (4.000.000 × 12)", "i = 0,015 = 1,5% mensual"]}, {"id": "Q022", "nivel": 2, "tema": "Interés simple", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿En cuántos meses $6.000.000 al 2% mensual simple llegan a $7.440.000?", "opciones": ["12,00 meses", "10,86 meses", "24,00 meses", "6,00 meses"], "correcta": 0, "feedback": ["¡Correcto! Solución: F/P = 7.440.000 / 6.000.000 = 1,24 → n = (F/P − 1) / i = 0,24 / 0,02 → n = 12 meses", "Usaste la fórmula de tiempo del interés compuesto.", "Revisa la división: 0,24 / 0,02 = 12.", "Revisa la división: 0,24 / 0,02 = 12."], "explicacion": "Solución: F/P = 7.440.000 / 6.000.000 = 1,24 → n = (F/P − 1) / i = 0,24 / 0,02 → n = 12 meses", "pasos": ["F/P = 7.440.000 / 6.000.000 = 1,24", "n = (F/P − 1) / i = 0,24 / 0,02", "n = 12 meses"]}, {"id": "Q023", "nivel": 2, "tema": "Interés simple", "tipo": "contrarreloj", "tiempo": 20, "puntos": 150, "enunciado": "¿Cuánto interés generan $1.000.000 al 3% mensual simple en 4 meses?", "opciones": ["$120.000", "$125.509", "$1.120.000", "$30.000"], "correcta": 0, "feedback": ["¡Correcto! Solución: I = 1.000.000 × 0,03 × 4 = 120.000", "Ese es el interés compuesto.", "Ese es el monto F; el interés es 120.000.", "Ese es el interés de un solo mes; multiplica por 4."], "explicacion": "Solución: I = 1.000.000 × 0,03 × 4 = 120.000", "pasos": ["I = 1.000.000 × 0,03 × 4 = 120.000"]}, {"id": "Q024", "nivel": 2, "tema": "Interés simple", "tipo": "caso", "tiempo": 120, "puntos": 250, "enunciado": "Don Pepe presta $2.000.000 al 24% anual simple durante 90 días (interés comercial). ¿Cuánto interés recibe?", "opciones": ["$120.000,00", "$118.356,16", "$240.000,00", "$480.000,00"], "correcta": 0, "feedback": ["¡Correcto! Solución: Interés comercial: año de 360 días → I = P · i · (d/360) = 2.000.000 × 0,24 × 90/360 → I = 120.000", "Usaste 365 días (interés exacto); el enunciado pide interés comercial (360).", "Revisa: 90 días son 3 meses = 0,25 años.", "Ese es el interés de todo un año, no de 90 días."], "explicacion": "Solución: Interés comercial: año de 360 días → I = P · i · (d/360) = 2.000.000 × 0,24 × 90/360 → I = 120.000", "pasos": ["Interés comercial: año de 360 días", "I = P · i · (d/360) = 2.000.000 × 0,24 × 90/360", "I = 120.000"]}, {"id": "Q025", "nivel": 3, "tema": "Interés compuesto", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Qué caracteriza al interés compuesto?", "opciones": ["Los intereses se retiran al final de cada periodo.", "Los intereses se suman al capital y generan nuevos intereses en los periodos siguientes.", "El interés es el mismo en todos los periodos.", "Solo se usa en créditos de corto plazo."], "correcta": 1, "feedback": ["Si se retiran, no se capitalizan; el modelo sería de interés simple.", "¡Correcto! Es 'interés sobre interés': F = P(1 + i)^n. El capital crece de forma exponencial.", "Eso es interés simple.", "Se usa en casi todas las operaciones financieras, de corto y largo plazo."], "explicacion": "Es 'interés sobre interés': F = P(1 + i)^n. El capital crece de forma exponencial.", "pasos": []}, {"id": "Q026", "nivel": 3, "tema": "Interés compuesto", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Cuál es la fórmula del valor futuro con interés compuesto?", "opciones": ["F = P · i^n", "F = P (1 + i)^n", "F = P (1 + i·n)", "F = P (1 + n)^i"], "correcta": 1, "feedback": ["Falta sumar 1 a la tasa; así el resultado no tiene sentido económico.", "¡Correcto! Cada periodo multiplica el saldo por (1 + i); tras n periodos: P(1 + i)^n.", "Esa es la fórmula del interés simple.", "Los papeles de i y n están invertidos."], "explicacion": "Cada periodo multiplica el saldo por (1 + i); tras n periodos: P(1 + i)^n.", "pasos": []}, {"id": "Q027", "nivel": 3, "tema": "Interés compuesto", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "La capitalización es:", "opciones": ["Descontar un valor futuro al presente.", "Retirar los intereses al final del periodo.", "Calcular la inflación del periodo.", "El proceso de sumar los intereses al capital para que también generen intereses."], "correcta": 3, "feedback": ["Eso es actualizar o descontar.", "Retirarlos es lo contrario: evita la capitalización.", "La capitalización no tiene relación directa con la inflación.", "¡Correcto! Capitalizar es convertir los intereses en capital al final de cada periodo de capitalización."], "explicacion": "Capitalizar es convertir los intereses en capital al final de cada periodo de capitalización.", "pasos": []}, {"id": "Q028", "nivel": 3, "tema": "Interés compuesto", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Para un mismo capital, tasa y un plazo mayor a un periodo, el interés compuesto frente al simple genera:", "opciones": ["Exactamente los mismos intereses.", "Más intereses.", "Menos intereses.", "Depende del banco, no del modelo."], "correcta": 1, "feedback": ["Solo son iguales cuando n = 1.", "¡Correcto! Desde el segundo periodo, el compuesto calcula interés sobre un saldo mayor, por eso supera al simple.", "Ocurre lo contrario cuando n > 1.", "La diferencia es matemática, no depende de la entidad."], "explicacion": "Desde el segundo periodo, el compuesto calcula interés sobre un saldo mayor, por eso supera al simple.", "pasos": []}, {"id": "Q029", "nivel": 3, "tema": "Interés compuesto", "tipo": "contrarreloj", "tiempo": 20, "puntos": 150, "enunciado": "Según la regla del 72, con una tasa del 8% anual compuesta, ¿en cuántos años aproximadamente se duplica el dinero?", "opciones": ["9 años.", "8 años.", "576 años.", "12,5 años."], "correcta": 0, "feedback": ["¡Correcto! Regla del 72: años ≈ 72 / tasa(%) = 72 / 8 = 9. (El valor exacto es ln2/ln1,08 ≈ 9,01 años.)", "Revisa la regla: se divide 72 entre la tasa, 72/8 = 9.", "Se divide 72 entre 8, no se multiplica.", "Eso sería con interés simple (100/8). Con compuesto se duplica antes."], "explicacion": "Regla del 72: años ≈ 72 / tasa(%) = 72 / 8 = 9. (El valor exacto es ln2/ln1,08 ≈ 9,01 años.)", "pasos": []}, {"id": "Q030", "nivel": 3, "tema": "Interés compuesto", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuál es el valor futuro de $5.000.000 al 1,2% mensual compuesto durante 24 meses?", "opciones": ["$6.657.364,02", "$6.440.000,00", "$5.120.720,00", "$1.440.000,00"], "correcta": 0, "feedback": ["¡Correcto! Solución: F = P(1 + i)^n → (1,012)^24 = 1,331473 → F = 5.000.000 × 1,331473 = 6.657.364,02", "Ese es el resultado con interés simple.", "Usaste n = 2 (años); con tasa mensual n debe estar en meses: 24.", "Eso es el interés simple, sin capital."], "explicacion": "Solución: F = P(1 + i)^n → (1,012)^24 = 1,331473 → F = 5.000.000 × 1,331473 = 6.657.364,02", "pasos": ["F = P(1 + i)^n", "(1,012)^24 = 1,331473", "F = 5.000.000 × 1,331473 = 6.657.364,02"]}, {"id": "Q031", "nivel": 3, "tema": "Interés compuesto", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuánto debes invertir hoy al 10% anual compuesto para tener $20.000.000 en 3 años?", "opciones": ["$26.620.000,00", "$15.026.296,02", "$15.384.615,38", "$14.580.000,00"], "correcta": 1, "feedback": ["Multiplicaste: eso lleva el valor más al futuro.", "¡Correcto! Solución: P = F / (1 + i)^n → P = 20.000.000 / (1,10)^3 = 20.000.000 / 1,331 → P = 15.026.296,02", "Usaste interés simple.", "Descontar no es multiplicar por (1 − i)^n; se divide entre (1 + i)^n."], "explicacion": "Solución: P = F / (1 + i)^n → P = 20.000.000 / (1,10)^3 = 20.000.000 / 1,331 → P = 15.026.296,02", "pasos": ["P = F / (1 + i)^n", "P = 20.000.000 / (1,10)^3 = 20.000.000 / 1,331", "P = 15.026.296,02"]}, {"id": "Q032", "nivel": 3, "tema": "Interés compuesto", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Un capital de $8.000.000 se convierte en $10.000.000 en 18 meses con interés compuesto. ¿Cuál es la tasa mensual?", "opciones": ["1,2474%", "16,0397%", "1,3889%", "101,2474%"], "correcta": 0, "feedback": ["¡Correcto! Solución: i = (F/P)^(1/n) − 1 → i = (1,25)^(1/18) − 1 → i = 1,2474% mensual", "Usaste n = 1,5 (años); con tasa mensual n = 18.", "Ese es el cálculo con interés simple.", "Olvidaste restar 1 al final."], "explicacion": "Solución: i = (F/P)^(1/n) − 1 → i = (1,25)^(1/18) − 1 → i = 1,2474% mensual", "pasos": ["i = (F/P)^(1/n) − 1", "i = (1,25)^(1/18) − 1", "i = 1,2474% mensual"]}, {"id": "Q033", "nivel": 3, "tema": "Interés compuesto", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿En cuántos meses $4.000.000 al 1,5% mensual compuesto se convierten en $6.000.000?", "opciones": ["27,03 meses", "2,27 meses", "33,33 meses", "27,23 meses"], "correcta": 3, "feedback": ["El denominador es ln(1 + i), no i.", "Ese resultado está en años; la tasa es mensual.", "Usaste la fórmula de interés simple.", "¡Correcto! Solución: n = ln(F/P) / ln(1 + i) → n = ln(1,5) / ln(1,015) → n = 0,405465 / 0,014889 = 27,23 meses"], "explicacion": "Solución: n = ln(F/P) / ln(1 + i) → n = ln(1,5) / ln(1,015) → n = 0,405465 / 0,014889 = 27,23 meses", "pasos": ["n = ln(F/P) / ln(1 + i)", "n = ln(1,5) / ln(1,015)", "n = 0,405465 / 0,014889 = 27,23 meses"]}, {"id": "Q034", "nivel": 3, "tema": "Interés compuesto", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuánto interés compuesto generan $10.000.000 al 2% mensual en 6 meses?", "opciones": ["$11.261.624,19", "$1.200.000,00", "$1.261.624,19", "$0,00"], "correcta": 2, "feedback": ["Ese es el monto F; el interés es F − P.", "Ese es el interés simple.", "¡Correcto! Solución: F = 10.000.000 × (1,02)^6 = 11.261.624,19 → I = F − P = 1.261.624,19", "No se eleva la tasa sola; se eleva (1 + i)."], "explicacion": "Solución: F = 10.000.000 × (1,02)^6 = 11.261.624,19 → I = F − P = 1.261.624,19", "pasos": ["F = 10.000.000 × (1,02)^6 = 11.261.624,19", "I = F − P = 1.261.624,19"]}, {"id": "Q035", "nivel": 3, "tema": "Interés compuesto", "tipo": "caso", "tiempo": 120, "puntos": 250, "enunciado": "Inviertes $12.000.000 durante 2 años al 12% anual. ¿Cuánto más ganas con interés compuesto que con simple?", "opciones": ["$3.052.800,00", "$0,00", "$172.800,00", "$2.880.000,00"], "correcta": 2, "feedback": ["Ese es el interés compuesto total, no la diferencia.", "Solo son iguales cuando n = 1; con 2 años el compuesto gana más.", "¡Correcto! Solución: Compuesto: F = 12.000.000 × 1,12² = 15.052.800 → Simple: F = 12.000.000 × (1 + 0,12 × 2) = 14.880.000 → Diferencia = 172.800", "Ese es el interés simple total (2 años); la pregunta pide la diferencia entre compuesto y simple."], "explicacion": "Solución: Compuesto: F = 12.000.000 × 1,12² = 15.052.800 → Simple: F = 12.000.000 × (1 + 0,12 × 2) = 14.880.000 → Diferencia = 172.800", "pasos": ["Compuesto: F = 12.000.000 × 1,12² = 15.052.800", "Simple: F = 12.000.000 × (1 + 0,12 × 2) = 14.880.000", "Diferencia = 172.800"]}, {"id": "Q036", "nivel": 3, "tema": "Interés compuesto", "tipo": "contrarreloj", "tiempo": 20, "puntos": 150, "enunciado": "¿En cuánto se convierte $1.000.000 al 10% anual compuesto en 2 años?", "opciones": ["$1.100.000", "$1.210.000", "$1.200.000", "$1.331.000"], "correcta": 1, "feedback": ["Ese es el valor tras un solo año.", "¡Correcto! Solución: F = 1.000.000 × (1,10)² = 1.210.000", "Ese es el resultado con interés simple.", "Eso corresponde a 3 años."], "explicacion": "Solución: F = 1.000.000 × (1,10)² = 1.210.000", "pasos": ["F = 1.000.000 × (1,10)² = 1.210.000"]}, {"id": "Q037", "nivel": 3, "tema": "Interés compuesto", "tipo": "caso", "tiempo": 120, "puntos": 250, "enunciado": "Abres un CDT de $15.000.000 al 9% EA por 3 años. ¿Cuánto recibes al vencimiento?", "opciones": ["$19.425.435,00", "$19.629.680,56", "$4.425.435,00", "$19.050.000,00"], "correcta": 0, "feedback": ["¡Correcto! Solución: F = 15.000.000 × (1,09)^3 → (1,09)^3 = 1,295029 → F = 19.425.435,00", "Trataste el 9% como nominal mensual; es efectivo anual.", "Ese es solo el interés ganado.", "Una tasa EA se capitaliza: usa interés compuesto."], "explicacion": "Solución: F = 15.000.000 × (1,09)^3 → (1,09)^3 = 1,295029 → F = 19.425.435,00", "pasos": ["F = 15.000.000 × (1,09)^3", "(1,09)^3 = 1,295029", "F = 19.425.435,00"]}, {"id": "Q038", "nivel": 4, "tema": "Conversión de tasas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Una tasa nominal es:", "opciones": ["La tasa que fija el gobierno por ley.", "Una tasa anual que se capitaliza varias veces al año y no refleja por sí sola el rendimiento real.", "Una tasa que no admite capitalización.", "La tasa que realmente se gana en un año."], "correcta": 1, "feedback": ["La nominal es un tipo de expresión de tasa, no una tasa legal.", "¡Correcto! La nominal j se divide entre m capitalizaciones para obtener la tasa periódica: i = j/m. Para conocer el rendimiento real se convierte a efectiva.", "Precisamente se define junto a una frecuencia de capitalización.", "Esa es la tasa efectiva anual (EA)."], "explicacion": "La nominal j se divide entre m capitalizaciones para obtener la tasa periódica: i = j/m. Para conocer el rendimiento real se convierte a efectiva.", "pasos": []}, {"id": "Q039", "nivel": 4, "tema": "Conversión de tasas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Una tasa efectiva es:", "opciones": ["Una tasa que solo se usa en interés simple.", "La nominal dividida entre 12 siempre.", "La tasa antes de capitalizar los intereses.", "La tasa que mide el rendimiento real del periodo, teniendo en cuenta la capitalización."], "correcta": 3, "feedback": ["Se usa precisamente en interés compuesto.", "Eso da una tasa periódica mensual solo si la nominal es MV.", "Es la que resulta DESPUÉS de considerar la capitalización.", "¡Correcto! La efectiva incorpora el efecto de 'interés sobre interés'. La más usada para comparar es la Efectiva Anual (EA)."], "explicacion": "La efectiva incorpora el efecto de 'interés sobre interés'. La más usada para comparar es la Efectiva Anual (EA).", "pasos": []}, {"id": "Q040", "nivel": 4, "tema": "Conversión de tasas", "tipo": "contrarreloj", "tiempo": 20, "puntos": 150, "enunciado": "La expresión '24% NMV' significa:", "opciones": ["24% efectivo mensual.", "2% anual.", "24% efectivo anual.", "24% anual nominal capitalizable mes vencido, es decir, 2% mensual."], "correcta": 3, "feedback": ["24% mensual sería una tasa altísima; la nominal anual se divide entre 12.", "El 2% es mensual, no anual.", "La EA de 24% NMV es mayor: (1,02)^12 − 1 = 26,82%.", "¡Correcto! NMV = nominal mes vencido. i = 24% / 12 = 2% mensual, liquidado al final de cada mes."], "explicacion": "NMV = nominal mes vencido. i = 24% / 12 = 2% mensual, liquidado al final de cada mes.", "pasos": []}, {"id": "Q041", "nivel": 4, "tema": "Conversión de tasas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "La tasa periódica a partir de una nominal j con m capitalizaciones al año es:", "opciones": ["i = j − m", "i = (1 + j)^m − 1", "i = j / m", "i = j · m"], "correcta": 2, "feedback": ["No tiene sentido restar el número de capitalizaciones.", "Esa estructura se usa para pasar de periódica a efectiva.", "¡Correcto! Ejemplo: 12% NTV → i = 12% / 4 = 3% trimestral.", "Se divide, no se multiplica."], "explicacion": "Ejemplo: 12% NTV → i = 12% / 4 = 3% trimestral.", "pasos": []}, {"id": "Q042", "nivel": 4, "tema": "Conversión de tasas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Para una misma tasa nominal, si aumenta la frecuencia de capitalización, la tasa efectiva anual:", "opciones": ["Aumenta.", "Disminuye.", "Se vuelve igual a la nominal.", "Permanece igual."], "correcta": 0, "feedback": ["¡Correcto! Más capitalizaciones = más 'interés sobre interés'. 12% NMV da 12,68% EA, mientras 12% NSV da 12,36% EA.", "Ocurre lo contrario.", "La EA solo iguala a la nominal cuando m = 1.", "Solo sería igual si no hubiera capitalización intermedia."], "explicacion": "Más capitalizaciones = más 'interés sobre interés'. 12% NMV da 12,68% EA, mientras 12% NSV da 12,36% EA.", "pasos": []}, {"id": "Q043", "nivel": 4, "tema": "Conversión de tasas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Una tasa anticipada se diferencia de una vencida en que:", "opciones": ["Siempre es mayor que la tasa vencida equivalente.", "Solo existe en interés simple.", "El interés se cobra al inicio del periodo; se convierte con iv = ia / (1 − ia).", "El interés se cobra al final del periodo."], "correcta": 2, "feedback": ["Es al revés: la vencida equivalente es mayor que la anticipada.", "Las tasas anticipadas se usan también en interés compuesto.", "¡Correcto! En una tasa anticipada el interés se descuenta al comienzo, por eso equivale a una vencida mayor: iv = ia/(1 − ia).", "Esa es la definición de tasa vencida."], "explicacion": "En una tasa anticipada el interés se descuenta al comienzo, por eso equivale a una vencida mayor: iv = ia/(1 − ia).", "pasos": []}, {"id": "Q044", "nivel": 4, "tema": "Conversión de tasas", "tipo": "contrarreloj", "tiempo": 20, "puntos": 150, "enunciado": "¿Cuál es la tasa mensual de un 18% NMV?", "opciones": ["18,0000%", "1,5000%", "1,3888%", "4,5000%"], "correcta": 1, "feedback": ["18% es anual nominal; se divide entre 12.", "¡Correcto! Solución: i = j / m = 18% / 12 = 1,5% mensual", "Así se convierte una EA, pero 18% es nominal mes vencido.", "Dividiste entre 4 (trimestral); MV indica 12 periodos."], "explicacion": "Solución: i = j / m = 18% / 12 = 1,5% mensual", "pasos": ["i = j / m = 18% / 12 = 1,5% mensual"]}, {"id": "Q045", "nivel": 4, "tema": "Conversión de tasas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuál es la tasa efectiva anual equivalente a 24% NMV?", "opciones": ["1.221,4789%", "26,8242%", "2,0000%", "24,0000%"], "correcta": 1, "feedback": ["Elevaste 1,24; primero hay que pasar a tasa mensual (2%).", "¡Correcto! Solución: i mensual = 24% / 12 = 2% → EA = (1 + 0,02)^12 − 1 → EA = 26,8242%", "2% es la tasa mensual; falta llevarla a efectiva anual con (1,02)^12 − 1.", "La EA es mayor que la nominal por la capitalización mensual."], "explicacion": "Solución: i mensual = 24% / 12 = 2% → EA = (1 + 0,02)^12 − 1 → EA = 26,8242%", "pasos": ["i mensual = 24% / 12 = 2%", "EA = (1 + 0,02)^12 − 1", "EA = 26,8242%"]}, {"id": "Q046", "nivel": 4, "tema": "Conversión de tasas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuál es la tasa efectiva anual equivalente a 12% NTV?", "opciones": ["42,5761%", "12,0000%", "12,5509%", "12,6825%"], "correcta": 2, "feedback": ["Elevaste a 12; en un año hay 4 trimestres.", "La EA siempre supera a la nominal si hay más de una capitalización.", "¡Correcto! Solución: i trimestral = 12% / 4 = 3% → EA = (1,03)^4 − 1 → EA = 12,5509%", "Dividiste entre 12; TV significa 4 trimestres."], "explicacion": "Solución: i trimestral = 12% / 4 = 3% → EA = (1,03)^4 − 1 → EA = 12,5509%", "pasos": ["i trimestral = 12% / 4 = 3%", "EA = (1,03)^4 − 1", "EA = 12,5509%"]}, {"id": "Q047", "nivel": 4, "tema": "Conversión de tasas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuál es la tasa mensual equivalente a 20% EA?", "opciones": ["791,6100%", "101,5309%", "1,5309%", "1,6667%"], "correcta": 2, "feedback": ["Elevaste a 12; para pasar de anual a mensual se eleva a 1/12.", "Olvidaste restar 1.", "¡Correcto! Solución: i = (1 + EA)^(1/12) − 1 → i = (1,20)^(1/12) − 1 → i = 1,5309% mensual", "Dividir entre 12 solo aplica a nominales; una EA se convierte con raíz 12."], "explicacion": "Solución: i = (1 + EA)^(1/12) − 1 → i = (1,20)^(1/12) − 1 → i = 1,5309% mensual", "pasos": ["i = (1 + EA)^(1/12) − 1", "i = (1,20)^(1/12) − 1", "i = 1,5309% mensual"]}, {"id": "Q048", "nivel": 4, "tema": "Conversión de tasas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuál es la tasa nominal semestre vencido (NSV) equivalente a 15% EA?", "opciones": ["7,2381%", "14,4761%", "15,0000%", "7,5000%"], "correcta": 1, "feedback": ["Esa es la tasa semestral efectiva; falta multiplicar por 2.", "¡Correcto! Solución: i semestral = (1,15)^(1/2) − 1 = 7,2381% → Nominal = i semestral × 2 → j = 14,4761% NSV", "La nominal es menor que la EA cuando hay varias capitalizaciones.", "Dividiste 15%/2; una EA se convierte con raíz cuadrada."], "explicacion": "Solución: i semestral = (1,15)^(1/2) − 1 = 7,2381% → Nominal = i semestral × 2 → j = 14,4761% NSV", "pasos": ["i semestral = (1,15)^(1/2) − 1 = 7,2381%", "Nominal = i semestral × 2", "j = 14,4761% NSV"]}, {"id": "Q049", "nivel": 4, "tema": "Conversión de tasas", "tipo": "caso", "tiempo": 120, "puntos": 250, "enunciado": "Para invertir, el Banco A ofrece 22% NMV y el Banco B 23% EA. ¿Cuál conviene?", "opciones": ["Son iguales", "Banco A, porque su EA es 24,36% > 23%", "Banco B, porque A rinde solo 22% EA", "Banco B, porque 23% es mayor que 22%"], "correcta": 1, "feedback": ["Al convertir, A rinde 24,36% EA, más que B.", "¡Correcto! Solución: Convertir A: i mensual = 22%/12 = 1,8333% → EA de A = (1,018333)^12 − 1 = 24,36% → Comparar: 24,36% > 23% → conviene el Banco A", "22% es nominal; capitalizado mensualmente rinde más.", "Comparaste una nominal con una efectiva; hay que pasarlas a la misma base."], "explicacion": "Solución: Convertir A: i mensual = 22%/12 = 1,8333% → EA de A = (1,018333)^12 − 1 = 24,36% → Comparar: 24,36% > 23% → conviene el Banco A", "pasos": ["Convertir A: i mensual = 22%/12 = 1,8333%", "EA de A = (1,018333)^12 − 1 = 24,36%", "Comparar: 24,36% > 23% → conviene el Banco A"]}, {"id": "Q050", "nivel": 4, "tema": "Conversión de tasas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Un crédito cobra 3% mensual anticipado. ¿Cuál es la tasa mensual vencida equivalente?", "opciones": ["3,0000%", "36,0000%", "2,9126%", "3,0928%"], "correcta": 3, "feedback": ["Una tasa anticipada equivale a una vencida MAYOR.", "Eso anualiza la tasa, no la convierte a vencida.", "Esa fórmula convierte de vencida a anticipada; aquí es al revés.", "¡Correcto! Solución: iv = ia / (1 − ia) → iv = 0,03 / 0,97 → iv = 3,0928% mensual"], "explicacion": "Solución: iv = ia / (1 − ia) → iv = 0,03 / 0,97 → iv = 3,0928% mensual", "pasos": ["iv = ia / (1 − ia)", "iv = 0,03 / 0,97", "iv = 3,0928% mensual"]}, {"id": "Q051", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "El valor presente (VP) de un flujo futuro es:", "opciones": ["El valor del flujo después de impuestos.", "El valor del flujo multiplicado por (1 + i)^n.", "La suma de todos los pagos sin considerar la tasa.", "Su valor hoy, obtenido al descontarlo con una tasa de interés."], "correcta": 3, "feedback": ["El VP no se refiere a impuestos sino al momento en el tiempo.", "Multiplicar lleva el valor al futuro, no al presente.", "Sumar pagos de fechas distintas ignora el valor del dinero en el tiempo.", "¡Correcto! P = F / (1 + i)^n. Permite comparar dinero de distintas fechas en el momento cero."], "explicacion": "P = F / (1 + i)^n. Permite comparar dinero de distintas fechas en el momento cero.", "pasos": []}, {"id": "Q052", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "'Descontar' o 'actualizar' un valor futuro significa:", "opciones": ["Restarle la tasa de interés.", "Multiplicarlo por (1 + i)^n.", "Aplicarle un descuento comercial del 10%.", "Dividirlo entre (1 + i)^n para llevarlo al presente."], "correcta": 3, "feedback": ["No se resta la tasa; se divide entre el factor (1 + i)^n.", "Eso es capitalizar, llevar al futuro.", "El término no se refiere a promociones comerciales.", "¡Correcto! Descontar es la operación inversa de capitalizar: P = F(1 + i)^−n."], "explicacion": "Descontar es la operación inversa de capitalizar: P = F(1 + i)^−n.", "pasos": []}, {"id": "Q053", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Si la tasa de descuento aumenta, el valor presente de un flujo futuro:", "opciones": ["Disminuye.", "Aumenta.", "Se vuelve negativo.", "No cambia."], "correcta": 0, "feedback": ["¡Correcto! En P = F/(1 + i)^n, un i mayor agranda el denominador y reduce P.", "Ocurre lo contrario: tasa y VP tienen relación inversa.", "Con F positivo, P sigue siendo positivo, solo más pequeño.", "La tasa está en la fórmula, así que sí cambia."], "explicacion": "En P = F/(1 + i)^n, un i mayor agranda el denominador y reduce P.", "pasos": []}, {"id": "Q054", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "El valor futuro de una inversión única crece cuando:", "opciones": ["Se reduce el plazo.", "Aumentan la tasa de interés o el número de periodos.", "Disminuye la tasa de interés.", "Se retiran los intereses cada periodo."], "correcta": 1, "feedback": ["Menos periodos = menos capitalización.", "¡Correcto! F = P(1 + i)^n crece con i y con n.", "Una tasa menor reduce F.", "Retirarlos impide la capitalización y reduce F."], "explicacion": "F = P(1 + i)^n crece con i y con n.", "pasos": []}, {"id": "Q055", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Para comparar alternativas con flujos en fechas distintas se debe:", "opciones": ["Escoger la alternativa con el pago más grande.", "Llevar todos los flujos a una misma fecha focal con la tasa de interés.", "Sumar los valores nominales de cada alternativa.", "Comparar solo el primer pago de cada alternativa."], "correcta": 1, "feedback": ["El mayor pago puede estar muy lejos en el tiempo y valer menos hoy.", "¡Correcto! La fecha focal puede ser cualquiera (hoy, el final, etc.); lo importante es que todos los flujos estén en la misma fecha.", "Ignora el valor del dinero en el tiempo.", "Se deben considerar todos los flujos."], "explicacion": "La fecha focal puede ser cualquiera (hoy, el final, etc.); lo importante es que todos los flujos estén en la misma fecha.", "pasos": []}, {"id": "Q056", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Ahorras $7.000.000 a una tasa del 14% NMV durante 2 años. ¿Cuál es el valor futuro?", "opciones": ["$7.164.286,11", "$9.246.909,70", "$8.960.000,00", "$9.097.200,00"], "correcta": 1, "feedback": ["Con tasa mensual, n debe ser 24 meses, no 2.", "¡Correcto! Solución: i = 14%/12 = 1,1667% mensual; n = 24 meses → F = 7.000.000 × (1,011667)^24 → F = 9.246.909,70", "Usaste interés simple.", "Trataste 14% como efectiva anual; es nominal mes vencido."], "explicacion": "Solución: i = 14%/12 = 1,1667% mensual; n = 24 meses → F = 7.000.000 × (1,011667)^24 → F = 9.246.909,70", "pasos": ["i = 14%/12 = 1,1667% mensual; n = 24 meses", "F = 7.000.000 × (1,011667)^24", "F = 9.246.909,70"]}, {"id": "Q057", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuál es el valor presente de $25.000.000 que se recibirán en 5 años, al 11% EA?", "opciones": ["$14.836.283,20", "$42.126.453,88", "$16.129.032,26", "$22.522.522,52"], "correcta": 0, "feedback": ["¡Correcto! Solución: P = F / (1 + i)^n → P = 25.000.000 / (1,11)^5 → P = 14.836.283,20", "Multiplicaste: eso es un valor futuro.", "Usaste interés simple.", "Descontaste un solo periodo; son 5 años."], "explicacion": "Solución: P = F / (1 + i)^n → P = 25.000.000 / (1,11)^5 → P = 14.836.283,20", "pasos": ["P = F / (1 + i)^n", "P = 25.000.000 / (1,11)^5", "P = 14.836.283,20"]}, {"id": "Q058", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Recibirás $3.000.000 en el mes 6 y $5.000.000 en el mes 12. Con 1,5% mensual, ¿cuál es su valor presente total?", "opciones": ["$8.000.000,00", "$6.925.563,69", "$6.691.099,38", "$7.316.337,54"], "correcta": 1, "feedback": ["Sumaste valores nominales sin descontarlos.", "¡Correcto! Solución: VP1 = 3.000.000 / (1,015)^6 = 2.743.626,58 → VP2 = 5.000.000 / (1,015)^12 = 4.181.937,11 → VP = 6.925.563,69", "Descontaste todo al mes 12; el primer pago está en el mes 6.", "Descontaste todo al mes 6; el segundo pago está en el mes 12."], "explicacion": "Solución: VP1 = 3.000.000 / (1,015)^6 = 2.743.626,58 → VP2 = 5.000.000 / (1,015)^12 = 4.181.937,11 → VP = 6.925.563,69", "pasos": ["VP1 = 3.000.000 / (1,015)^6 = 2.743.626,58", "VP2 = 5.000.000 / (1,015)^12 = 4.181.937,11", "VP = 6.925.563,69"]}, {"id": "Q059", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "caso", "tiempo": 120, "puntos": 250, "enunciado": "Debes $4.000.000 hoy y $6.000.000 en el mes 8. Quieres reemplazarlos por un solo pago en el mes 12 con 2% mensual. ¿De cuánto es?", "opciones": ["$12.102.923,46", "$10.000.000,00", "$12.682.417,95", "$11.567.560,14"], "correcta": 3, "feedback": ["La deuda del mes 8 se lleva al mes 12: son 4 meses.", "Sumaste sin llevar los valores al mes 12.", "La deuda del mes 8 solo se capitaliza 4 meses, no 12.", "¡Correcto! Solución: Fecha focal: mes 12 → 4.000.000 × (1,02)^12 = 5.072.967,18 → 6.000.000 × (1,02)^4 = 6.494.592,96 → Pago = 11.567.560,14"], "explicacion": "Solución: Fecha focal: mes 12 → 4.000.000 × (1,02)^12 = 5.072.967,18 → 6.000.000 × (1,02)^4 = 6.494.592,96 → Pago = 11.567.560,14", "pasos": ["Fecha focal: mes 12", "4.000.000 × (1,02)^12 = 5.072.967,18", "6.000.000 × (1,02)^4 = 6.494.592,96", "Pago = 11.567.560,14"]}, {"id": "Q060", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Inviertes $9.000.000 al 13% NTV durante 3 años. ¿Cuánto tendrás?", "opciones": ["$12.986.073,00", "$9.906.327,70", "$12.510.000,00", "$13.210.621,00"], "correcta": 3, "feedback": ["13% es nominal trimestral, no efectiva anual.", "Con tasa trimestral, n son 12 trimestres.", "Usaste interés simple.", "¡Correcto! Solución: i = 13%/4 = 3,25% trimestral; n = 12 trimestres → F = 9.000.000 × (1,0325)^12 → F = 13.210.621,00"], "explicacion": "Solución: i = 13%/4 = 3,25% trimestral; n = 12 trimestres → F = 9.000.000 × (1,0325)^12 → F = 13.210.621,00", "pasos": ["i = 13%/4 = 3,25% trimestral; n = 12 trimestres", "F = 9.000.000 × (1,0325)^12", "F = 13.210.621,00"]}, {"id": "Q061", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "contrarreloj", "tiempo": 20, "puntos": 150, "enunciado": "¿Cuál es el valor presente de $1.100.000 que se reciben en un año, al 10% anual?", "opciones": ["$1.210.000", "$1.100.000", "$990.000", "$1.000.000"], "correcta": 3, "feedback": ["Multiplicaste; para el VP se divide.", "Ese es el valor futuro.", "Restaste el 10% del valor futuro; se debe dividir entre 1,10.", "¡Correcto! Solución: P = 1.100.000 / 1,10 = 1.000.000"], "explicacion": "Solución: P = 1.100.000 / 1,10 = 1.000.000", "pasos": ["P = 1.100.000 / 1,10 = 1.000.000"]}, {"id": "Q062", "nivel": 5, "tema": "Valor presente y valor futuro", "tipo": "caso", "tiempo": 120, "puntos": 250, "enunciado": "Vendes tu carro: A ofrece $30.000.000 de contado; B ofrece $33.500.000 en 10 meses. Tu tasa es 1% mensual. ¿Qué eliges?", "opciones": ["A, porque el contado siempre es mejor", "B, porque su VP es $30.327.112,98", "A, porque el VP de B es $30.454.545,45", "Son equivalentes"], "correcta": 1, "feedback": ["No siempre: hay que comparar en la misma fecha con la tasa.", "¡Correcto! Solución: VP de B = 33.500.000 / (1,01)^10 → VP de B = 30.327.112,98 → Como es mayor que 30.000.000, conviene B", "Usaste interés simple (1,10); se debe usar (1,01)^10.", "El VP de B es $30.327.112,98, distinto de 30.000.000."], "explicacion": "Solución: VP de B = 33.500.000 / (1,01)^10 → VP de B = 30.327.112,98 → Como es mayor que 30.000.000, conviene B", "pasos": ["VP de B = 33.500.000 / (1,01)^10", "VP de B = 30.327.112,98", "Como es mayor que 30.000.000, conviene B"]}, {"id": "Q063", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Una anualidad es una serie de pagos que cumple:", "opciones": ["Pagos que se hacen únicamente una vez al año.", "Pagos iguales, en intervalos de tiempo iguales y con la misma tasa por periodo.", "Pagos crecientes cada periodo.", "Un único pago al final del plazo."], "correcta": 1, "feedback": ["El nombre engaña: los pagos pueden ser mensuales, trimestrales, etc.", "¡Correcto! Las tres condiciones permiten usar las fórmulas de series uniformes en lugar de descontar pago por pago.", "Esas son series gradientes, no anualidades.", "Un solo pago es un valor futuro, no una serie."], "explicacion": "Las tres condiciones permiten usar las fórmulas de series uniformes en lugar de descontar pago por pago.", "pasos": []}, {"id": "Q064", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "En una anualidad vencida los pagos se realizan:", "opciones": ["En fechas aleatorias.", "Al final de cada periodo.", "Solo al final del plazo total.", "Al inicio de cada periodo."], "correcta": 1, "feedback": ["Una anualidad requiere intervalos iguales.", "¡Correcto! Es el caso típico de las cuotas de un crédito: se paga al terminar cada mes.", "Eso sería un pago único.", "Esa es la anualidad anticipada."], "explicacion": "Es el caso típico de las cuotas de un crédito: se paga al terminar cada mes.", "pasos": []}, {"id": "Q065", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Cuál es la fórmula del valor presente de una anualidad vencida?", "opciones": ["P = A · [1 − (1 + i)^−n] / i · (1 + i)", "P = A · n", "P = A · [1 − (1 + i)^−n] / i", "P = A · [(1 + i)^n − 1] / i"], "correcta": 2, "feedback": ["Esa es la versión para anualidades anticipadas.", "Ignora el valor del dinero en el tiempo.", "¡Correcto! Es la suma de n pagos A descontados uno a uno; la fórmula los resume en un solo factor.", "Esa es la fórmula del valor futuro de la anualidad."], "explicacion": "Es la suma de n pagos A descontados uno a uno; la fórmula los resume en un solo factor.", "pasos": []}, {"id": "Q066", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "El valor futuro de una anualidad vencida queda ubicado:", "opciones": ["En la fecha del último pago.", "En el momento cero.", "Un periodo después del último pago.", "En la mitad del plazo."], "correcta": 0, "feedback": ["¡Correcto! F = A[(1 + i)^n − 1]/i acumula todos los pagos justo en el momento del pago n.", "En el momento cero está el valor presente.", "Así queda el VF de una anualidad anticipada.", "Las fórmulas no ubican valores a mitad del plazo."], "explicacion": "F = A[(1 + i)^n − 1]/i acumula todos los pagos justo en el momento del pago n.", "pasos": []}, {"id": "Q067", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Si se conoce el valor del crédito P, la tasa i y el número de cuotas n, la cuota vencida se calcula con:", "opciones": ["A = P · (1 + i)^n", "A = P / n", "A = P · i / [1 − (1 + i)^−n]", "A = P · i"], "correcta": 2, "feedback": ["Eso da el valor futuro de P, no la cuota.", "Dividir el crédito en partes iguales ignora los intereses.", "¡Correcto! Se despeja A de la fórmula del valor presente de la anualidad vencida.", "Eso es solo el interés del primer periodo."], "explicacion": "Se despeja A de la fórmula del valor presente de la anualidad vencida.", "pasos": []}, {"id": "Q068", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "¿Cuál es el valor presente de 8 pagos anuales vencidos de $2.000.000 al 11% anual?", "opciones": ["$11.424.392,53", "$16.000.000,00", "$10.292.245,52", "$23.718.868,54"], "correcta": 2, "feedback": ["Esa es la fórmula para anualidad anticipada.", "Sumaste los pagos sin descontarlos.", "¡Correcto! Solución: P = A · [1 − (1 + i)^−n] / i → [1 − (1,11)^−8] / 0,11 = 5,146123 → P = 2.000.000 × 5,146123 = 10.292.245,52", "Ese es el valor futuro de la serie."], "explicacion": "Solución: P = A · [1 − (1 + i)^−n] / i → [1 − (1,11)^−8] / 0,11 = 5,146123 → P = 2.000.000 × 5,146123 = 10.292.245,52", "pasos": ["P = A · [1 − (1 + i)^−n] / i", "[1 − (1,11)^−8] / 0,11 = 5,146123", "P = 2.000.000 × 5,146123 = 10.292.245,52"]}, {"id": "Q069", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Pagas 18 cuotas mensuales vencidas de $350.000 al 14% NMV. ¿Cuál es el valor presente?", "opciones": ["$5.652.895,36", "$6.300.000,00", "$6.965.381,03", "$2.263.597,16"], "correcta": 0, "feedback": ["¡Correcto! Solución: i = 14%/12 = 1,1667% → factor = [1 − (1,011667)^−18]/0,011667 = 16,151130 → P = 5.652.895,36", "Sumaste las cuotas sin descontar.", "Ese es el valor futuro.", "Usaste 14% como tasa mensual; se divide entre 12."], "explicacion": "Solución: i = 14%/12 = 1,1667% → factor = [1 − (1,011667)^−18]/0,011667 = 16,151130 → P = 5.652.895,36", "pasos": ["i = 14%/12 = 1,1667%", "factor = [1 − (1,011667)^−18]/0,011667 = 16,151130", "P = 5.652.895,36"]}, {"id": "Q070", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Ahorras $1.200.000 trimestrales vencidos durante 3 años al 13% NTV. ¿Cuánto acumulas?", "opciones": ["$17.274.342,58", "$3.718.267,50", "$14.400.000,00", "$11.768.491,67"], "correcta": 0, "feedback": ["¡Correcto! Solución: i = 13%/4 = 3,25%; n = 12 trimestres → F = 1.200.000 × [(1,0325)^12 − 1]/0,0325 → F = 17.274.342,58", "Con tasa trimestral, n son 12 trimestres.", "Sumaste los depósitos sin intereses.", "Ese es el valor presente; se pide el acumulado."], "explicacion": "Solución: i = 13%/4 = 3,25%; n = 12 trimestres → F = 1.200.000 × [(1,0325)^12 − 1]/0,0325 → F = 17.274.342,58", "pasos": ["i = 13%/4 = 3,25%; n = 12 trimestres", "F = 1.200.000 × [(1,0325)^12 − 1]/0,0325", "F = 17.274.342,58"]}, {"id": "Q071", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Depositas $500.000 al final de cada mes durante 36 meses al 1% mensual. ¿Cuál es el valor futuro?", "opciones": ["$21.753.823,57", "$18.000.000,00", "$21.538.439,18", "$715.384,39"], "correcta": 2, "feedback": ["Esa es la fórmula anticipada; los depósitos son al final del mes.", "Sumaste los depósitos sin intereses.", "¡Correcto! Solución: F = A · [(1 + i)^n − 1] / i → [(1,01)^36 − 1]/0,01 = 43,076878 → F = 21.538.439,18", "Capitalizaste un solo depósito; son 36."], "explicacion": "Solución: F = A · [(1 + i)^n − 1] / i → [(1,01)^36 − 1]/0,01 = 43,076878 → F = 21.538.439,18", "pasos": ["F = A · [(1 + i)^n − 1] / i", "[(1,01)^36 − 1]/0,01 = 43,076878", "F = 21.538.439,18"]}, {"id": "Q072", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Un crédito de $15.000.000 se paga en 36 cuotas mensuales vencidas al 1,5% mensual. ¿Cuál es la cuota?", "opciones": ["$534.271,86", "$542.285,93", "$416.666,67", "$641.666,67"], "correcta": 1, "feedback": ["Esa es la cuota anticipada.", "¡Correcto! Solución: A = P · i / [1 − (1 + i)^−n] → A = 15.000.000 × 0,015 / [1 − (1,015)^−36] → A = 542.285,93", "Dividiste el crédito sin incluir intereses.", "Usaste interés simple."], "explicacion": "Solución: A = P · i / [1 − (1 + i)^−n] → A = 15.000.000 × 0,015 / [1 − (1,015)^−36] → A = 542.285,93", "pasos": ["A = P · i / [1 − (1 + i)^−n]", "A = 15.000.000 × 0,015 / [1 − (1,015)^−36]", "A = 542.285,93"]}, {"id": "Q073", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Quieres reunir $20.000.000 en 24 meses con depósitos mensuales vencidos al 1%. ¿Cuánto debes depositar?", "opciones": ["$833.333,33", "$734.128,16", "$741.469,44", "$941.469,44"], "correcta": 2, "feedback": ["Dividiste sin considerar los intereses que generan los ahorros.", "Esa es la cuota anticipada.", "¡Correcto! Solución: A = F · i / [(1 + i)^n − 1] → A = 20.000.000 × 0,01 / [(1,01)^24 − 1] → A = 741.469,44", "Usaste la fórmula de cuota de un crédito (VP), pero la meta es un valor futuro."], "explicacion": "Solución: A = F · i / [(1 + i)^n − 1] → A = 20.000.000 × 0,01 / [(1,01)^24 − 1] → A = 741.469,44", "pasos": ["A = F · i / [(1 + i)^n − 1]", "A = 20.000.000 × 0,01 / [(1,01)^24 − 1]", "A = 741.469,44"]}, {"id": "Q074", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Un crédito de $12.000.000 se paga con cuotas mensuales vencidas de $800.000 al 1,2% mensual. ¿Cuántas cuotas son?", "opciones": ["1,39 meses", "13,88 meses", "16,64 meses", "15,00 meses"], "correcta": 2, "feedback": ["Ese resultado está en años.", "Usaste la fórmula de n para valor futuro; aquí se conoce el valor presente.", "¡Correcto! Solución: n = ln[A/(A − P·i)] / ln(1 + i) → P·i = 144.000; A − P·i = 656.000 → n = ln(1,219512)/ln(1,012) = 16,64 meses", "Dividiste el crédito entre la cuota sin considerar intereses."], "explicacion": "Solución: n = ln[A/(A − P·i)] / ln(1 + i) → P·i = 144.000; A − P·i = 656.000 → n = ln(1,219512)/ln(1,012) = 16,64 meses", "pasos": ["n = ln[A/(A − P·i)] / ln(1 + i)", "P·i = 144.000; A − P·i = 656.000", "n = ln(1,219512)/ln(1,012) = 16,64 meses"]}, {"id": "Q075", "nivel": 6, "tema": "Anualidades vencidas", "tipo": "caso", "tiempo": 120, "puntos": 250, "enunciado": "Una moto cuesta $9.000.000. Pagas 20% de cuota inicial y el resto en 24 cuotas mensuales vencidas al 1,8%. ¿Cuál es la cuota?", "opciones": ["$372.102,01", "$465.127,52", "$300.000,00", "$93.025,50"], "correcta": 0, "feedback": ["¡Correcto! Solución: Saldo a financiar = 9.000.000 × 0,8 = 7.200.000 → A = 7.200.000 × 0,018 / [1 − (1,018)^−24] → A = 372.102,01", "Olvidaste descontar la cuota inicial.", "Dividiste sin intereses.", "Financiaste el 20%; se financia el 80% restante."], "explicacion": "Solución: Saldo a financiar = 9.000.000 × 0,8 = 7.200.000 → A = 7.200.000 × 0,018 / [1 − (1,018)^−24] → A = 372.102,01", "pasos": ["Saldo a financiar = 9.000.000 × 0,8 = 7.200.000", "A = 7.200.000 × 0,018 / [1 − (1,018)^−24]", "A = 372.102,01"]}, {"id": "Q076", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "En una anualidad anticipada los pagos se realizan:", "opciones": ["Al final de cada periodo.", "Al inicio de cada periodo.", "Solo al final del plazo.", "Dos veces por periodo."], "correcta": 1, "feedback": ["Esa es la anualidad vencida.", "¡Correcto! Ejemplos típicos: el arriendo, la matrícula o una suscripción que se paga por adelantado.", "Eso sería un pago único futuro.", "La anualidad tiene un pago por periodo."], "explicacion": "Ejemplos típicos: el arriendo, la matrícula o una suscripción que se paga por adelantado.", "pasos": []}, {"id": "Q077", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Qué relación existe entre el valor presente de una anualidad anticipada y una vencida con iguales A, i y n?", "opciones": ["Son exactamente iguales.", "VP anticipada = VP vencida + i.", "VP anticipada = VP vencida ÷ (1 + i).", "VP anticipada = VP vencida × (1 + i)."], "correcta": 3, "feedback": ["Difieren en el factor (1 + i).", "El ajuste es multiplicativo, no aditivo.", "Es al revés: los pagos anticipados están más cerca de hoy y valen más.", "¡Correcto! Cada pago anticipado ocurre un periodo antes, por eso vale (1 + i) veces más."], "explicacion": "Cada pago anticipado ocurre un periodo antes, por eso vale (1 + i) veces más.", "pasos": []}, {"id": "Q078", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "¿Cuál de estas situaciones es un ejemplo típico de anualidad anticipada?", "opciones": ["La cuota de un crédito de vehículo que se paga al final de cada mes.", "El arriendo que se paga al comienzo de cada mes.", "Una pensión que se recibe al final de cada mes trabajado.", "Un CDT que paga todo al vencimiento."], "correcta": 1, "feedback": ["Es una anualidad vencida.", "¡Correcto! El arrendatario paga por adelantado el mes que va a usar.", "Pagos al final del periodo son vencidos.", "Es un pago único, no una serie."], "explicacion": "El arrendatario paga por adelantado el mes que va a usar.", "pasos": []}, {"id": "Q079", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "Con el mismo valor financiado, tasa y número de pagos, la cuota anticipada comparada con la vencida es:", "opciones": ["El doble.", "Mayor.", "Igual.", "Menor."], "correcta": 3, "feedback": ["No hay relación de doble; la diferencia es el factor (1 + i).", "Al pagar antes se reduce el saldo antes, por lo que la cuota es menor.", "Difieren en el factor (1 + i).", "¡Correcto! A_ant = A_venc / (1 + i). Como se paga antes, se generan menos intereses."], "explicacion": "A_ant = A_venc / (1 + i). Como se paga antes, se generan menos intereses.", "pasos": []}, {"id": "Q080", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "teorica", "tiempo": 30, "puntos": 100, "enunciado": "El valor futuro de una anualidad anticipada queda ubicado:", "opciones": ["Un periodo después del último pago.", "Un periodo antes del primer pago.", "En el momento cero.", "En la fecha del último pago."], "correcta": 0, "feedback": ["¡Correcto! F_ant = A[(1 + i)^n − 1]/i · (1 + i): el factor (1 + i) lo traslada un periodo adelante del último pago.", "Eso no corresponde a ninguna fórmula estándar.", "Ahí se ubica el valor presente.", "Así queda el VF de una anualidad vencida."], "explicacion": "F_ant = A[(1 + i)^n − 1]/i · (1 + i): el factor (1 + i) lo traslada un periodo adelante del último pago.", "pasos": []}, {"id": "Q081", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Un arriendo de $1.800.000 se paga al inicio de cada mes durante 12 meses. Con 1% mensual, ¿cuál es su valor presente?", "opciones": ["$20.259.139,45", "$20.461.730,85", "$20.058.553,91", "$21.600.000,00"], "correcta": 1, "feedback": ["Esa es la fórmula vencida; el arriendo se paga al inicio.", "¡Correcto! Solución: P = A · [1 − (1 + i)^−n]/i · (1 + i) → factor vencido = 11,255077 → P = 1.800.000 × 11,255077 × 1,01 = 20.461.730,85", "Dividiste entre (1 + i); en anticipadas se multiplica.", "Sumaste sin descontar."], "explicacion": "Solución: P = A · [1 − (1 + i)^−n]/i · (1 + i) → factor vencido = 11,255077 → P = 1.800.000 × 11,255077 × 1,01 = 20.461.730,85", "pasos": ["P = A · [1 − (1 + i)^−n]/i · (1 + i)", "factor vencido = 11,255077", "P = 1.800.000 × 11,255077 × 1,01 = 20.461.730,85"]}, {"id": "Q082", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Ahorras $400.000 al inicio de cada mes durante 24 meses al 14% NMV. ¿Cuánto tendrás al final?", "opciones": ["$9.600.000,00", "$72.348.330,89", "$11.005.272,00", "$11.133.666,84"], "correcta": 3, "feedback": ["Sumaste sin intereses.", "14% es nominal anual; la tasa mensual es 1,1667%.", "Esa es la fórmula vencida; los depósitos son al inicio.", "¡Correcto! Solución: i = 1,1667% mensual → F = 400.000 × [(1,011667)^24 − 1]/0,011667 × 1,011667 → F = 11.133.666,84"], "explicacion": "Solución: i = 1,1667% mensual → F = 400.000 × [(1,011667)^24 − 1]/0,011667 × 1,011667 → F = 11.133.666,84", "pasos": ["i = 1,1667% mensual", "F = 400.000 × [(1,011667)^24 − 1]/0,011667 × 1,011667", "F = 11.133.666,84"]}, {"id": "Q083", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Se financian $10.000.000 con 12 cuotas mensuales anticipadas al 2%. ¿Cuál es la cuota?", "opciones": ["$945.595,97", "$833.333,33", "$927.054,87", "$964.507,89"], "correcta": 2, "feedback": ["Esa es la cuota vencida.", "Dividiste sin intereses.", "¡Correcto! Solución: A = P · i(1 + i)^n / {[(1 + i)^n − 1](1 + i)} → (1,02)^12 = 1,268242 → A = 927.054,87", "Multiplicaste por (1 + i); la cuota anticipada se divide."], "explicacion": "Solución: A = P · i(1 + i)^n / {[(1 + i)^n − 1](1 + i)} → (1,02)^12 = 1,268242 → A = 927.054,87", "pasos": ["A = P · i(1 + i)^n / {[(1 + i)^n − 1](1 + i)}", "(1,02)^12 = 1,268242", "A = 927.054,87"]}, {"id": "Q084", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "numerica", "tiempo": 90, "puntos": 200, "enunciado": "Un crédito de $12.000.000 se paga con 4 cuotas semestrales anticipadas al 12% NSV. ¿Cuál es la cuota?", "opciones": ["$3.463.097,91", "$3.000.000,00", "$3.527.511,82", "$3.267.073,50"], "correcta": 3, "feedback": ["Esa es la cuota vencida.", "Dividiste sin intereses.", "La tasa semestral es 6%, no 12%.", "¡Correcto! Solución: i = 12%/2 = 6% semestral → A = 12.000.000 × 0,06(1,06)^4 / {[(1,06)^4 − 1](1,06)} → A = 3.267.073,50"], "explicacion": "Solución: i = 12%/2 = 6% semestral → A = 12.000.000 × 0,06(1,06)^4 / {[(1,06)^4 − 1](1,06)} → A = 3.267.073,50", "pasos": ["i = 12%/2 = 6% semestral", "A = 12.000.000 × 0,06(1,06)^4 / {[(1,06)^4 − 1](1,06)}", "A = 3.267.073,50"]}, {"id": "Q085", "nivel": 7, "tema": "Anualidades anticipadas", "tipo": "caso", "tiempo": 120, "puntos": 250, "enunciado": "En el crédito de $10.000.000 a 12 cuotas mensuales anticipadas al 2%, ¿cuánto se paga en total de intereses?", "opciones": ["$11.124.658,43", "$1.347.151,59", "$2.400.000,00", "$1.124.658,43"], "correcta": 3, "feedback": ["Ese es el total pagado; resta el capital.", "Usaste la cuota vencida; el crédito es anticipado.", "Ese es el interés simple sobre el capital inicial, pero el saldo disminuye con cada cuota.", "¡Correcto! Solución: Cuota anticipada = 927.054,87 → Total pagado = 927.054,87 × 12 = 11.124.658,43 → Intereses = 11.124.658,43 − 10.000.000 = 1.124.658,43"], "explicacion": "Solución: Cuota anticipada = 927.054,87 → Total pagado = 927.05 function nivelJugador(xp){ return Math.floor(xp/1000)+1; }

/* RNG con semilla (misma secuencia para todos en una sala) */
function rngDe(semilla){ let h = 2166136261; for(const c of String(semilla)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0)/4294967296; }; }
function barajar(arr, rnd){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function seleccionar(modo, nivel, semilla){
  const rnd = rngDe(semilla ?? (Date.now()+Math.random()));
  const activas = banco.filter(q => q.activa !== false);
  const deNivel = n => barajar(activas.filter(q => q.nivel === n), rnd);

  const sel = [];
  for(let n=1;n<=7;n++){ const q = deNivel(n)[0]; if(q) sel.push(q); }
  return sel.concat(deNivel(8).slice(0,3));
}

  const bono = Math.round(base * 0.5 * Math.max(0, tiempoRestante) / tiempoTotal);

  return Math.round((base + bono) * mult * (doble ? 2 : 1));
}
