/* ================= Juego ================= */
function nuevoJugador(nombre, color){ return {nombre, color, puntaje:0, vidas:config.vidas, racha:0, aciertos:0, usados:[], perdioVida:false, respondidas:0}; }
function iniciarJuego({modo, nivel, equipos:eqs, semilla}){
  const preguntas = seleccionar(modo === "campana" ? "campana" : "expres", nivel, semilla);
  const tiempos = modo === "campana" ? config.campana : config.expres;
  const jugadores = modo === "equipos" ? eqs.map((n,i) => nuevoJugador(n, COLORES[i])) : [nuevoJugador(perfil.alias, perfil.color)];
  juego = {modo, nivel, preguntas, tiempos, jugadores, idx:0, turno:0, activos:{}, eliminadas:[], pista:false,
           respondida:null, insigniasNuevas:[], mejorRacha:0};
  if(sala){ if(sala.anfitrion){ sala.ronda = (sala.ronda||0) + 1; publicarSala({estado:"jugando", ronda:sala.ronda, puntaje:0, aciertos:0, idx:0}); } else publicarSala({estado:"jugando", puntaje:0, aciertos:0, idx:0}); }
  mostrarPregunta();
}
function jugadorActual(){ return juego.jugadores[juego.modo === "equipos" ? juego.turno % juego.jugadores.length : 0]; }
function preguntaActual(){ return juego.preguntas[juego.idx]; }
function mostrarPregunta(){
  vista = "juego";
  const q = preguntaActual(), j = jugadorActual();
  juego.activos = {}; juego.eliminadas = []; juego.pista = false; juego.respondida = null;
  juego.total = juego.tiempos[q.tipo] || q.tiempo;
  juego.restante = juego.total; juego.inicioMs = performance.now();
  pintarJuego(); arrancarReloj();
}
function arrancarReloj(){
  detenerReloj();
  reloj = setInterval(() => {
    juego.restante = Math.max(0, juego.total - (performance.now() - juego.inicioMs)/1000);
    pintarReloj();
    if(juego.restante <= 0){ detenerReloj(); responder(-1); }
  }, 200);
}
function detenerReloj(){ if(reloj){ clearInterval(reloj); reloj = null; } }
function svgVida(llena){ return `<svg class="vida" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21 2.5 11.6A5.6 5.6 0 0 1 12 4.4a5.6 5.6 0 0 1 9.5 7.2Z" fill="${llena?"#FF5470":"none"}" stroke="${llena?"#FF5470":"#2A3570"}" stroke-width="2"/></svg>`; }
function pintarReloj(){
  const el = document.getElementById("reloj"); if(!el) return;
  const fr = juego.restante / juego.total, C = 2*Math.PI*32;
  el.querySelector("circle.p").setAttribute("stroke-dasharray", `${C*fr} ${C}`);
  el.querySelector("circle.p").setAttribute("stroke", fr < .25 ? "#FF5470" : fr < .5 ? "#F2B705" : "#B39DFF");
  el.querySelector(".t").textContent = Math.ceil(juego.restante);
  el.classList.toggle("critico", fr < .25);
}

  const q = preguntaActual(), j = jugadorActual(), r = juego.respondida;
  const etiqueta = juego.modo === "campana" ? `Nivel ${juego.nivel} · ${esc(NIVELES[juego.nivel])}` : `${juego.modo === "equipos" ? "Duelo de equipos" : "Misión Exprés"} · Nivel ${q.nivel}: ${esc(q.tema)}`;
  const C = 2*Math.PI*32;
  $app.innerHTML = `<div class="juego">
  <section class="panel marco" aria-live="polite">
    <div class="barra">
      <div id="reloj" class="reloj" role="timer" aria-label="Tiempo restante"><svg width="74" height="74" viewBox="0 0 74 74"><circle cx="37" cy="37" r="32" fill="none" stroke="#2A3570" stroke-width="6"/><circle class="p" cx="37" cy="37" r="32" fill="none" stroke="#B39DFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C} ${C}"/></svg><span class="t">${Math.ceil(juego.restante)}</span></div>
      <div style="display:grid;gap:6px;min-width:0;flex:1">

          <span class="chip mor">${TIPO_NOMBRE[q.tipo]} · ${q.puntos} pts</span>
          <span class="chip oro">${fmt(j.puntaje)} XP</span>
          ${j.racha >= 2 ? `<span class="chip oro">Racha ×${j.racha}</span>` : ""}
          <span class="vidas" aria-label="${j.vidas} vidas">${Array.from({length:config.vidas},(_,k)=>svgVida(k<j.vidas)).join("")}</span>

    <p class="pregunta">${esc(q.enunciado)}</p>

      let cl = ""; if(r){ if(k === q.correcta) cl = "bien"; else if(k === r.opcion) cl = "malo"; else cl = "fuera"; } else if(juego.eliminadas.includes(k)) cl = "fuera";
      return `<button class="op ${cl}" type="button" data-op="${k}" ${r || juego.eliminadas.includes(k) ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span class="tx">${esc(o)}</span></button>`; }).join("")}</div>
    ${juego.pista && !r ? `<div class="pista"><b>Pista:</b> ${esc(FORMULAS[q.nivel])}${q.pasos && q.pasos.length > 1 ? `<br>Primer paso: ${esc(q.pasos[0])}` : ""}</div>` : ""}
    ${r ? pintarFeedback(q, r) : `<div class="poderes">${PODERES.map(p => {
      const usado = j.usados.includes(p.id), act = juego.activos[p.id];
      return `<button class="poder ${act?"activo":""}" type="button" data-poder="${p.id}" ${usado?"disabled":""} title="${esc(p.desc)}">${iconoPoder(p.id)}${esc(p.nombre)}</button>`; }).join("")}</div>`}
  </section>
  <aside class="rail">${pintarRail()}</aside></div>`;
  pintarReloj();
  $app.querySelectorAll("[data-op]").forEach(b => b.onclick = () => responder(+b.dataset.op));
  $app.querySelectorAll("[data-poder]").forEach(b => b.onclick = () => usarPoder(b.dataset.poder));
  const sig = document.getElementById("siguiente"); if(sig){ sig.onclick = siguiente; sig.focus(); }
}
function iconoPoder(id){
  const p = {fifty:'<path d="M4 12h16M12 4v16" stroke-width="2.2"/>',tiempo:'<circle cx="12" cy="13" r="7" fill="none" stroke-width="2"/><path d="M12 9v4l3 2M10 3h4" stroke-width="2"/>',
    escudo:'<path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6Z" fill="none" stroke-width="2"/>',pista:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3Z" fill="none" stroke-width="2"/>',
    doble:'<path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7Z" fill="none" stroke-width="2"/>'}[id];
  return `<svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
function pintarFeedback(q, r){
  const ok = r.correcta, txt = r.opcion >= 0 ? q.feedback[r.opcion].replace(/^¡Correcto! /,"") : "Se agotó el tiempo.";
  const ultimo = juego.idx >= juego.preguntas.length - 1 || juego.terminar;
  return `<div class="feedback ${ok?"ok":"no"}">
    <h3><span>${ok ? "¡Correcto!" : r.opcion < 0 ? "Tiempo agotado" : "Respuesta incorrecta"}</span><span style="font-family:var(--mono);color:${ok?"var(--ok)":"var(--mal)"}">${ok ? "+"+fmt(r.puntos)+" XP" : r.escudo ? "Escudo activado: conservas tu vida" : "−1 vida"}</span></h3>
    <p style="margin:0">${esc(txt)}</p>
    ${!ok ? `<p style="margin:0"><b>Respuesta correcta:</b> ${esc(q.opciones[q.correcta])}</p>` : ""}
    ${q.pasos && q.pasos.length ? `<ol class="pasos">${q.pasos.map(p => `<li>${esc(p)}</li>`).join("")}</ol>` : !ok ? `<p class="tenue" style="margin:0">${esc(q.explicacion)}</p>` : ""}
    <div class="fila" style="justify-content:flex-end"><button class="btn pri" id="siguiente" type="button">${ultimo ? "Ver resultados" : "Siguiente pregunta"}</button></div></div>`;
}
function usarPoder(id){
  const j = jugadorActual(), q = preguntaActual();
  if(j.usados.includes(id) || juego.respondida) return;
  j.usados.push(id);
  if(id === "fifty"){ const malas = q.opciones.map((_,k)=>k).filter(k => k !== q.correcta); juego.eliminadas = barajar(malas, Math.random).slice(0,2); }
  if(id === "tiempo"){ juego.total += 15; }
  if(id === "escudo" || id === "doble") juego.activos[id] = true;
  if(id === "pista") juego.pista = true;
  toast(PODERES.find(p => p.id === id).nombre + " activado");
  pintarJuego();
}
function responder(opcion){
  if(juego.respondida) return;
  detenerReloj();
  const q = preguntaActual(), j = jugadorActual();
  const correcta = opcion === q.correcta, seg = (performance.now() - juego.inicioMs)/1000;
  const r = {opcion, correcta, puntos:0, escudo:false};
  j.respondidas++;
  if(correcta){
    j.racha++; j.aciertos++; juego.mejorRacha = Math.max(juego.mejorRacha, j.racha);
    r.puntos = calcularPuntos({base:q.puntos, tiempoTotal:juego.total, tiempoRestante:juego.restante, racha:j.racha, doble:juego.activos.doble});
    j.puntaje += r.puntos;
    if(juego.modo !== "equipos"){ if(j.aciertos === 1) ganar("despegue"); if(j.racha >= 5) ganar("fuego"); if(seg < 5) ganar("rayo"); }
  } else {
    j.racha = 0;
    if(juego.activos.escudo) r.escudo = true; else { j.vidas--; j.perdioVida = true; }
  }
  juego.respondida = r;
  if(juego.modo !== "equipos" && j.vidas <= 0) juego.terminar = true;
  if(juego.modo === "equipos" && juego.jugadores.every(x => x.vidas <= 0)) juego.terminar = true;
  if(sala) publicarSala({puntaje:j.puntaje, aciertos:j.aciertos, idx:juego.idx+1, vidas:j.vidas});
  pintarJuego();
}
function siguiente(){
  if(juego.terminar || juego.idx >= juego.preguntas.length - 1) return finalizar();
  juego.idx++;
  if(juego.modo === "equipos"){ do { juego.turno++; } while(jugadorActual().vidas <= 0); }
  mostrarPregunta();
}
function ganar(id){
  if(!perfil || perfil.insignias.includes(id)) return;
  perfil.insignias.push(id); juego.insigniasNuevas.push(id);
  toast("Insignia desbloqueada: " + INSIGNIAS.find(x => x.id === id).nombre);

function finalizar(){
  detenerReloj();
  const j = juego.jugadores[0], total = juego.preguntas.length;
  let med = null;
  if(juego.modo !== "equipos"){
    perfil.xp += j.puntaje;
    if(j.respondidas === total && !j.perdioVida) ganar("invicto");
    if(j.respondidas === total && j.usados.length === 0) ganar("sinayuda");
    if(juego.modo === "campana"){
      med = medalla(j.aciertos, total);
      const orden = {oro:3, plata:2, bronce:1};
      if(med && (orden[med] > (orden[perfil.medallas[juego.nivel]]||0))) perfil.medallas[juego.nivel] = med;
      if(j.aciertos >= 3 && juego.nivel < 8) perfil.desbloqueado = Math.max(perfil.desbloqueado||1, juego.nivel+1);
      const M = perfil.medallas;
      if(M[2]==="oro" && M[3]==="oro") ganar("interes");
      if(M[4]==="oro") ganar("conversor");
      if(M[5]==="oro") ganar("tiempo");
      if(M[6]==="oro" && M[7]==="oro") ganar("anualidades");
      if(juego.nivel === 8 && j.aciertos >= 3) ganar("comandante");
    } else if(j.aciertos >= 8) ganar("comandante");
    guardarPerfil();
    historial.push({alias:perfil.alias, color:perfil.color, puntaje:j.puntaje, aciertos:j.aciertos, total, modo:juego.modo, nivel:juego.nivel||null, fecha:new Date().toISOString().slice(0,10)});
    historial = historial.sort((a,b)=>b.puntaje-a.puntaje).slice(0,50); ls.set("mf_historial", historial);
  }
  if(sala) publicarSala({estado:"fin", puntaje:j.puntaje, aciertos:j.aciertos, idx:total});
  ir("resultados", med);
}

function svgMedalla(tipo){

  return `<svg class="medalla" viewBox="0 0 90 90" role="img" aria-label="Medalla de ${tipo}"><path d="M30 4h12l8 26H38Z" fill="#7C4DFF"/><path d="M60 4H48l-8 26h12Z" fill="#B39DFF"/><circle cx="45" cy="56" r="28" fill="${c[0]}"/><circle cx="45" cy="56" r="20" fill="none" stroke="${c[1]}" stroke-width="3"/><text x="45" y="63" text-anchor="middle" font-family="Chakra Petch,sans-serif" font-weight="700" font-size="20" fill="#0A0F24">$</text></svg>`;
}
function tarjetaInsignia(i, on){

}

/* ================= Sala en línea (Firebase Firestore) ================= */
let fbEstado = null;
async function obtenerFb(){
  if(fbEstado) return fbEstado;
  const cfg = window.FIREBASE_CONFIG || {};
  if(!cfg.apiKey || !cfg.projectId || !window.firebase){ return null; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    const cred = await firebase.auth().signInAnonymously();
    fbEstado = {db: firebase.firestore(), uid: cred.user.uid};
    return fbEstado;
  }catch(e){ console.error("Firebase:", e); return null; }
}
function codigoNuevo(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; return Array.from({length:5},()=>a[Math.floor(Math.random()*a.length)]).join(""); }
async function abrirSala(codigo){
  const anfitrion = !codigo; codigo = codigo || codigoNuevo();
  $app.innerHTML = `<div class="panel" style="max-width:560px;margin:0 auto"><div class="eti">Conectando</div><h2 style="margin-top:6px">Abriendo la sala ${esc(codigo)}…</h2></div>`;
  const f = await obtenerFb();
  if(!f) return sinSala("sin-config");
  try{
    const ref = f.db.collection("salas").doc(codigo);
    if(anfitrion){
      await ref.set({anfitrion:f.uid, estado:"espera", ronda:0, creada:firebase.firestore.FieldValue.serverTimestamp()});
    } else {
      const s = await ref.get();
      if(!s.exists){ toast("No existe una sala con el código " + codigo); return ir("modos"); }
    }
    sala = {codigo, anfitrion, ref, uid:f.uid, jugadores:[], info:null, rondaJugada:0};
    if(!anfitrion){ const s = await ref.get(); const d = s.data() || {}; if(d.estado === "jugando") sala.rondaVista = d.ronda; }
    sala.off1 = ref.onSnapshot(d => { sala.info = d.data() || null; actualizarSala(); }, e => console.error(e));
    sala.off2 = ref.collection("jugadores").onSnapshot(q => { sala.jugadores = q.docs.map(d => ({id:d.id, ...d.data()})); actualizarSala(); }, e => console.error(e));
    await ref.collection("jugadores").doc(f.uid).set({alias:perfil.alias, color:perfil.color, rol:anfitrion?"anfitrion":"jugador", estado:"lobby", puntaje:0, aciertos:0, idx:0, vidas:config.vidas, actualizado:firebase.firestore.FieldValue.serverTimestamp()});
    ir("lobby");
  }catch(e){ console.error(e); sinSala(e && e.code); }
}
function sinSala(code){
  sala = null;
  const sinConfig = code === "sin-config";
  $app.innerHTML = `<div class="panel marco" style="max-width:640px;margin:0 auto;display:grid;gap:12px">
    <div class="eti">Sala en línea no disponible</div><h2>${sinConfig ? "Las salas en línea aún no están configuradas" : "No fue posible conectar con el servidor de salas"}</h2>
    <p class="tenue" style="margin:0">${sinConfig ? "El anfitrión debe pegar la configuración de su proyecto Firebase en este archivo (ver guía de publicación)." : "Revisa tu conexión a internet e inténtalo de nuevo." + (code ? " (Código: " + esc(code) + ")" : "")}</p>
    <p style="margin:0">Mientras tanto puedes jugar la <b>Misión Exprés</b> individual o el <b>Duelo de equipos</b> en pantalla compartida.</p>
    <div class="fila"><button class="btn pri" type="button" data-ir="equipos">Ir a Duelo de equipos</button><button class="btn" type="button" data-ir="modos">Volver</button></div></div>`;
}
function publicarSala(patch){
  if(!sala) return;
  const datos = {...patch}; delete datos.ronda;
  datos.actualizado = firebase.firestore.FieldValue.serverTimestamp();
  sala.ref.collection("jugadores").doc(sala.uid).set(datos, {merge:true}).catch(e => console.error(e));
  if(sala.anfitrion && patch.ronda) sala.ref.update({estado:"jugando", ronda:patch.ronda}).catch(e => console.error(e));
}
function jugadoresSala(){ return sala ? sala.jugadores : []; }
function filasSala(){
  const js = jugadoresSala().slice().sort((a,b)=>(+b.puntaje||0)-(+a.puntaje||0) || (+b.aciertos||0)-(+a.aciertos||0));
  if(!js.length) return `<li><span></span><span></span><span class="tenue">Esperando jugadores…</span><span></span></li>`;
  return js.map((s,k) => { const al = String(s.alias||"Piloto").slice(0,16), col = /^#[0-9A-Fa-f]{6}$/.test(s.color) ? s.color : "#B39DFF";
    const est = s.estado === "fin" ? "terminó" : s.estado === "jugando" ? `pregunta ${Math.min(+s.idx||0,10)}/10` : "en sala";
    return `<li class="${s.id === sala.uid ? "yo" : ""}"><span class="pos">${k+1}</span><span class="av" style="background:${col}">${esc(al.slice(0,2).toUpperCase())}</span><span class="nom">${esc(al)}${s.rol==="anfitrion"?" ★":""}<span class="sub">${+s.aciertos||0} aciertos · ${est}</span></span><span class="pts">${fmt(+s.puntaje||0)}</span></li>`; }).join("");
}
function actualizarSala(){
  if(!sala) return;
  for(const id of ["rank-sala","lobby-lista","tablero-lista"]){ const el = document.getElementById(id); if(el) el.innerHTML = filasSala(); }
  const n = document.getElementById("tablero-n"); if(n) n.textContent = jugadoresSala().length;
  if(vista === "lobby" && !sala.anfitrion && sala.info && sala.info.estado === "jugando"){
    const r = +sala.info.ronda || 0;
    if(r > (sala.rondaJugada||0)){ sala.rondaJugada = r; iniciarJuego({modo:"expres", semilla:sala.codigo + "-" + r}); }
  }
}

function guardarBanco(){ ls.set("mf_banco", banco); }
function validar(q){
  const err = [];
  if(!(q.nivel >= 1 && q.nivel <= 8)) err.push("nivel entre 1 y 8");
  if(!TIPO_NOMBRE[q.tipo]) err.push("tipo válido (teorica, contrarreloj, numerica, caso, reto)");
  if(!q.enunciado || q.enunciado.length < 10) err.push("enunciado de al menos 10 caracteres");
  if(!Array.isArray(q.opciones) || q.opciones.length !== 4 || q.opciones.some(o => !String(o).trim())) err.push("4 opciones con texto");
  if(!(q.correcta >= 0 && q.correcta <= 3)) err.push("índice de respuesta correcta 0–3");
  return err;
}
function normalizar(q){
  const base = {teorica:100, contrarreloj:150, numerica:200, caso:250, reto:300};
  q.nivel = +q.nivel; q.correcta = +q.correcta; q.tema = NIVELES[q.nivel]; q.puntos = +q.puntos || base[q.tipo];
  q.tiempo = CONFIG_BASE.campana[q.tipo]; q.pasos = q.pasos || []; q.explicacion = q.explicacion || "";
  q.feedback = (q.feedback && q.feedback.length === 4) ? q.feedback : q.opciones.map((_,k) => k === q.correcta ? "¡Correcto! " + q.explicacion : "Revisa el procedimiento. " + q.explicacion);
  return q;
}
function importar(txt){
  let arr; try{ arr = JSON.parse(txt); }catch(e){ toast("El texto no es un JSON válido"); return; }
  if(!Array.isArray(arr)) arr = arr.preguntas || [arr];
  let ok = 0, malos = 0; let n = banco.length;
  arr.forEach(q => { if(validar(q).length){ malos++; return; } q = normalizar({...q}); q.id = q.id && !banco.some(x=>x.id===q.id) ? q.id : "N" + String(++n).padStart(3,"0"); banco.push(q); ok++; });
  guardarBanco(); toast(`${ok} importadas${malos ? ", " + malos + " con errores" : ""}`); VISTAS.admin();
}
function editor(q){
  const nuevo = !q; q = q || {nivel:filtroNivel||1, tipo:"teorica", enunciado:"", opciones:["","","",""], correcta:0, feedback:["","","",""], explicacion:""};
  const el = document.getElementById("editor");
  el.innerHTML = `<form class="panel marco grid" id="f-ed" style="margin-bottom:18px">
    <div class="eti">${nuevo ? "Nueva pregunta" : "Editar " + esc(q.id)}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <label for="e-niv">Nivel<select id="e-niv">${Object.entries(NIVELES).map(([n,nom]) => `<option value="${n}" ${+n===q.nivel?"selected":""}>${n}. ${esc(nom)}</option>`).join("")}</select></label>
      <label for="e-tip">Tipo<select id="e-tip">${Object.entries(TIPO_NOMBRE).map(([t,nom]) => `<option value="${t}" ${t===q.tipo?"selected":""}>${nom}</option>`).join("")}</select></label>
      <label for="e-cor">Respuesta correcta<select id="e-cor">${[0,1,2,3].map(k => `<option value="${k}" ${k===q.correcta?"selected":""}>${"ABCD"[k]}</option>`).join("")}</select></label></div>
    <label for="e-enu">Enunciado<textarea id="e-enu" style="font-family:var(--cuerpo)">${esc(q.enunciado)}</textarea></label>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${[0,1,2,3].map(k => `<div class="grid" style="gap:6px"><label for="e-o${k}">Opción ${"ABCD"[k]}<input id="e-o${k}" type="text" value="${esc(q.opciones[k])}"></label><label for="e-f${k}">Retroalimentación ${"ABCD"[k]}<input id="e-f${k}" type="text" value="${esc((q.feedback[k]||"").replace(/^¡Correcto! /,""))}"></label></div>`).join("")}</div>
    <label for="e-exp">Explicación general<textarea id="e-exp" style="font-family:var(--cuerpo)">${esc(q.explicacion)}</textarea></label>
    <div class="fila"><button class="btn pri" type="submit">Guardar pregunta</button><button class="btn" type="button" id="e-can">Cancelar</button></div></form>`;
  el.scrollIntoView({behavior:"smooth"});
  document.getElementById("e-can").onclick = () => el.innerHTML = "";
  document.getElementById("f-ed").onsubmit = e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim();
    const d = {nivel:+v("e-niv"), tipo:v("e-tip"), correcta:+v("e-cor"), enunciado:v("e-enu"), opciones:[0,1,2,3].map(k=>v("e-o"+k)), explicacion:v("e-exp")};
    const err = validar(d); if(err.length){ toast("Falta: " + err[0]); return; }
    d.feedback = [0,1,2,3].map(k => (k===d.correcta ? "¡Correcto! " : "") + (v("e-f"+k) || d.explicacion));
    if(nuevo){ d.id = "N" + String(banco.length+1).padStart(3,"0"); banco.push(normalizar(d)); }
    else Object.assign(q, normalizar({...q, ...d}));
    guardarBanco(); toast("Pregunta guardada"); VISTAS.admin();
  };
}

document.addEventListener("keydown", e => {
  if(vista !== "juego" || !juego || e.target.closest("input,textarea,select")) return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());
  if(k >= 0 && !juego.respondida){ const op = k % 4; if(!juego.eliminadas.includes(op)) responder(op); }
  else if(e.key === "Enter" && juego.respondida){ e.preventDefault(); siguiente(); }
});
/* ================= Arranque ================= */
pintarPiloto();
ir("inicio");
</script>
